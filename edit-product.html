<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>ویرایش محصول | بارمان مرکب کویر</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Vazirmatn', 'Tahoma', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            direction: rtl;
            padding: 20px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        
        /* هدر */
        .header {
            background: white;
            border-radius: 25px;
            padding: 20px 30px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .logo { display: flex; align-items: center; gap: 12px; cursor: pointer; }
        .logo-icon {
            width: 48px; height: 48px;
            background: linear-gradient(135deg, #e67e22, #d35400);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
        }
        .logo h1 { font-size: 22px; color: #333; }
        .logo h1 span { color: #e67e22; }
        .back-btn {
            background: linear-gradient(135deg, #e67e22, #d35400);
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .back-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(230,126,34,0.3); }
        
        /* کارت اصلی */
        .edit-card {
            background: white;
            border-radius: 30px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.15);
            animation: fadeInUp 0.5s ease;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* هدر کارت */
        .card-header {
            background: linear-gradient(135deg, #e67e22, #d35400);
            padding: 30px;
            color: white;
            position: relative;
            overflow: hidden;
        }
        .card-header::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            animation: rotate 20s linear infinite;
        }
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .card-header h2 {
            font-size: 28px;
            display: flex;
            align-items: center;
            gap: 12px;
            position: relative;
            z-index: 1;
        }
        .card-header p {
            opacity: 0.9;
            margin-top: 8px;
            position: relative;
            z-index: 1;
        }
        .product-id-badge {
            background: rgba(255,255,255,0.2);
            display: inline-block;
            padding: 5px 15px;
            border-radius: 30px;
            font-size: 12px;
            margin-top: 15px;
            position: relative;
            z-index: 1;
        }
        
        /* فرم */
        .form-body {
            padding: 35px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
        }
        .form-group-full {
            grid-column: span 2;
        }
        .form-group {
            margin-bottom: 5px;
        }
        .form-group label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }
        .form-group label i {
            color: #e67e22;
            margin-left: 8px;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #e0e0e0;
            border-radius: 16px;
            font-size: 14px;
            font-family: 'Vazirmatn', sans-serif;
            transition: all 0.3s ease;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none;
            border-color: #e67e22;
            box-shadow: 0 0 0 4px rgba(230,126,34,0.1);
        }
        
        /* بخش آپلود عکس */
        .image-upload-area {
            border: 2px dashed #ddd;
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #fafafa;
            margin-top: 10px;
        }
        .image-upload-area:hover {
            border-color: #e67e22;
            background: #fef9e7;
        }
        .image-preview {
            width: 180px;
            height: 180px;
            margin: 0 auto 15px;
            border-radius: 16px;
            overflow: hidden;
            background: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .image-preview img { width: 100%; height: 100%; object-fit: cover; }
        .image-preview span { font-size: 50px; color: #ccc; }
        .upload-icon { font-size: 30px; color: #e67e22; margin-bottom: 10px; display: block; }
        
        /* چک‌باکس‌ها */
        .checkbox-group {
            display: flex;
            gap: 25px;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        .checkbox-group label {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            padding: 10px 20px;
            background: #f8f9fa;
            border-radius: 40px;
            transition: all 0.3s ease;
        }
        .checkbox-group label:hover { background: #fef5e7; }
        .checkbox-group input {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #e67e22;
        }
        
        /* دکمه‌ها */
        .form-actions {
            display: flex;
            gap: 15px;
            margin-top: 35px;
            padding-top: 25px;
            border-top: 2px solid #f0f0f0;
        }
        .save-btn {
            flex: 1;
            background: linear-gradient(135deg, #27ae60, #1e8449);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .save-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(39,174,96,0.3); }
        .cancel-btn {
            flex: 1;
            background: #f8f9fa;
            color: #666;
            border: 2px solid #e0e0e0;
            padding: 14px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .cancel-btn:hover { background: #e74c3c; color: white; border-color: #e74c3c; }
        
        /* پیام toast */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 30px;
            background: #27ae60;
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            z-index: 2000;
            transform: translateX(-450px);
            transition: transform 0.3s ease;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            font-weight: 500;
        }
        .toast.show { transform: translateX(0); }
        .toast.error { background: #e74c3c; }
        
        @media (max-width: 768px) {
            .form-grid { grid-template-columns: 1fr; }
            .form-group-full { grid-column: span 1; }
            .form-body { padding: 25px; }
            .card-header h2 { font-size: 22px; }
            .form-actions { flex-direction: column; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="logo" onclick="window.location.href='admin-panel.html'">
            <div class="logo-icon"><i class="fas fa-hard-hat"></i></div>
            <h1>ویرایش <span>محصول</span></h1>
        </div>
        <button class="back-btn" onclick="window.location.href='admin-panel.html'">
            <i class="fas fa-arrow-right"></i> بازگشت به پنل
        </button>
    </div>

    <div class="edit-card">
        <div class="card-header">
            <h2><i class="fas fa-edit"></i> ویرایش محصول</h2>
            <p>اطلاعات محصول را ویرایش کنید و تغییرات را ذخیره نمایید</p>
            <div class="product-id-badge" id="productIdBadge">
                <i class="fas fa-barcode"></i> شناسه محصول: <span id="productId">---</span>
            </div>
        </div>
        
        <div class="form-body">
            <div class="form-grid">
                <div class="form-group">
                    <label><i class="fas fa-tag"></i> دسته‌بندی</label>
                    <select id="editCategory">
                        <option value="cement">🧱 سیمان</option>
                        <option value="block">🔲 بلوک</option>
                        <option value="brick">🧱 آجر</option>
                        <option value="steel">📐 تیرآهن</option>
                        <option value="roof">🏠 سقف</option>
                        <option value="tile">🔲 کاشی</option>
                        <option value="wood">🌲 چوب</option>
                        <option value="door">🚪 درب و پنجره</option>
                        <option value="paint">🎨 رنگ</option>
                        <option value="tools">🔧 ابزارآلات</option>
                    </select>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-heading"></i> نام محصول</label>
                    <input type="text" id="editName" placeholder="نام محصول">
                </div>
                <div class="form-group">
                    <label><i class="fas fa-money-bill"></i> قیمت (تومان)</label>
                    <input type="number" id="editPrice" placeholder="قیمت محصول">
                </div>
                <div class="form-group">
                    <label><i class="fas fa-money-bill-wave"></i> قیمت قبلی (تخفیف)</label>
                    <input type="number" id="editOldPrice" placeholder="قیمت قبل از تخفیف">
                </div>
                <div class="form-group">
                    <label><i class="fas fa-box"></i> موجودی انبار</label>
                    <input type="number" id="editStock" placeholder="تعداد موجودی">
                </div>
                <div class="form-group">
                    <label><i class="fas fa-star"></i> امتیاز (1-5)</label>
                    <input type="number" id="editRating" step="0.1" min="1" max="5" placeholder="امتیاز محصول">
                </div>
                <div class="form-group-full">
                    <label><i class="fas fa-align-right"></i> توضیحات محصول</label>
                    <textarea id="editDesc" rows="4" placeholder="توضیحات کامل محصول..."></textarea>
                </div>
                <div class="form-group-full">
                    <label><i class="fas fa-image"></i> عکس محصول</label>
                    <div class="image-upload-area" onclick="document.getElementById('editImage').click()">
                        <div class="image-preview" id="imagePreview">
                            <span><i class="fas fa-camera upload-icon"></i><br>برای آپلود کلیک کنید</span>
                        </div>
                        <input type="file" id="editImage" accept="image/*" style="display:none" onchange="previewImage(event)">
                        <p style="font-size:12px; color:#999;">فرمت‌های مجاز: JPG, PNG, GIF | حداکثر 2 مگابایت</p>
                    </div>
                </div>
            </div>
            
            <div class="checkbox-group">
                <label><input type="checkbox" id="editIsNew"> 🆕 محصول جدید است</label>
                <label><input type="checkbox" id="editIsAmazing"> 🔥 محصول شگفت‌انگیز است</label>
            </div>
            
            <div class="form-actions">
                <button class="save-btn" onclick="saveProduct()"><i class="fas fa-save"></i> ذخیره تغییرات</button>
                <button class="cancel-btn" onclick="window.location.href='admin-panel.html'"><i class="fas fa-times"></i> انصراف</button>
            </div>
        </div>
    </div>
</div>

<div class="toast" id="toast"><i class="fas fa-check-circle"></i> <span id="toastMsg"></span></div>

<script>
    const STORAGE_KEY = 'barman_products';
    let currentProductId = null;
    let products = [];
    let currentImageData = null;

    function getProductIdFromUrl() {
        const params = new URLSearchParams(window.location.search);
        return parseInt(params.get('id'));
    }

    function loadProducts() {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
            products = JSON.parse(saved);
        } else {
            products = [];
        }
        loadProduct();
    }

    function loadProduct() {
        currentProductId = getProductIdFromUrl();
        if (!currentProductId) {
            showToast('محصول یافت نشد!', 'error');
            setTimeout(() => window.location.href = 'admin-panel.html', 1500);
            return;
        }
        
        const product = products.find(p => p.id === currentProductId);
        if (!product) {
            showToast('محصول یافت نشد!', 'error');
            setTimeout(() => window.location.href = 'admin-panel.html', 1500);
            return;
        }
        
        // نمایش شناسه محصول
        document.getElementById('productId').innerText = product.id;
        document.getElementById('productIdBadge').style.display = 'inline-block';
        
        // پر کردن فرم با اطلاعات محصول
        document.getElementById('editName').value = product.name || '';
        document.getElementById('editPrice').value = product.price || '';
        document.getElementById('editOldPrice').value = product.oldPrice || '';
        document.getElementById('editStock').value = product.stock || 0;
        document.getElementById('editRating').value = product.rating || 4.5;
        document.getElementById('editDesc').value = product.desc || '';
        document.getElementById('editCategory').value = product.category || 'cement';
        document.getElementById('editIsNew').checked = product.isNew || false;
        document.getElementById('editIsAmazing').checked = product.isAmazing || false;
        
        // نمایش عکس فعلی
        if (product.imageData) {
            currentImageData = product.imageData;
            document.getElementById('imagePreview').innerHTML = `<img src="${product.imageData}" style="width:100%; height:100%; object-fit:cover;">`;
        } else {
            const emojiMap = { cement:"🧱", block:"🔲", brick:"🧱", steel:"📐", roof:"🏠", tile:"🔲", wood:"🌲", door:"🚪", paint:"🎨", tools:"🔧" };
            const emoji = emojiMap[product.category] || "📦";
            document.getElementById('imagePreview').innerHTML = `<span style="font-size:50px;">${emoji}</span>`;
        }
    }

    function previewImage(event) {
        const file = event.target.files[0];
        if (file) {
            if (file.size > 2 * 1024 * 1024) {
                showToast('حجم فایل نباید بیشتر از 2 مگابایت باشد!', 'error');
                return;
            }
            const reader = new FileReader();
            reader.onload = function(e) {
                currentImageData = e.target.result;
                document.getElementById('imagePreview').innerHTML = `<img src="${e.target.result}" style="width:100%; height:100%; object-fit:cover;">`;
            }
            reader.readAsDataURL(file);
        }
    }

    function saveProduct() {
        const name = document.getElementById('editName').value.trim();
        const price = parseInt(document.getElementById('editPrice').value);
        const oldPrice = parseInt(document.getElementById('editOldPrice').value) || null;
        const category = document.getElementById('editCategory').value;
        const desc = document.getElementById('editDesc').value.trim();
        const stock = parseInt(document.getElementById('editStock').value) || 0;
        const rating = parseFloat(document.getElementById('editRating').value) || 4.5;
        const isNew = document.getElementById('editIsNew').checked;
        const isAmazing = document.getElementById('editIsAmazing').checked;
        
        if (!name || !price || !desc) {
            showToast('❌ لطفاً نام، قیمت و توضیحات را پر کنید!', 'error');
            return;
        }
        
        const index = products.findIndex(p => p.id === currentProductId);
        if (index === -1) {
            showToast('محصول یافت نشد!', 'error');
            return;
        }
        
        const emojiMap = { cement:"🧱", block:"🔲", brick:"🧱", steel:"📐", roof:"🏠", tile:"🔲", wood:"🌲", door:"🚪", paint:"🎨", tools:"🔧" };
        
        products[index] = {
            ...products[index],
            name: name,
            price: price,
            oldPrice: oldPrice,
            category: category,
            desc: desc,
            stock: stock,
            rating: rating,
            isNew: isNew,
            isAmazing: isAmazing,
            emoji: emojiMap[category] || "📦",
            imageData: currentImageData
        };
        
        localStorage.setItem(STORAGE_KEY, JSON.stringify(products));
        localStorage.setItem('products_updated', Date.now().toString());
        
        showToast('✅ محصول با موفقیت ویرایش شد!');
        
        setTimeout(() => {
            window.location.href = 'admin-panel.html';
        }, 1000);
    }

    function showToast(msg, type = 'success') {
        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toastMsg');
        toastMsg.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'}"></i> ${msg}`;
        toast.classList.add('show');
        if (type === 'error') toast.classList.add('error');
        else toast.classList.remove('error');
        setTimeout(() => toast.classList.remove('show'), 2500);
    }

    loadProducts();
</script>
</body>
</html>
