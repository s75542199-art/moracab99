<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدیریت محصولات | بارمان مرکب کویر</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Tahoma', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e8ecf1 100%);
            min-height: 100vh;
            direction: rtl;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        .header {
            background: white;
            border-radius: 20px;
            padding: 18px 30px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        .logo { display: flex; align-items: center; gap: 12px; cursor: pointer; }
        .logo-icon {
            width: 48px; height: 48px;
            background: linear-gradient(135deg, #e67e22, #d35400);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
        }
        .logo h1 { font-size: 22px; color: #333; }
        .logo h1 span { color: #e67e22; }
        .user-info { display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }
        .admin-badge {
            background: linear-gradient(135deg, #e67e22, #d35400);
            color: white;
            padding: 8px 20px;
            border-radius: 40px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
        }
        .btn {
            background: #e67e22;
            color: white;
            border: none;
            padding: 8px 22px;
            border-radius: 40px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn:hover { transform: translateY(-2px); background: #d35400; }
        .btn-review { background: #27ae60; }
        .btn-review:hover { background: #1e8449; }
        .btn-shop { background: #3498db; }
        .btn-shop:hover { background: #2980b9; }
        .logout-btn { background: #e74c3c; }
        .logout-btn:hover { background: #c0392b; }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: white;
            border-radius: 20px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 18px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            transition: all 0.3s ease;
        }
        .stat-card:hover { transform: translateY(-5px); box-shadow: 0 15px 35px rgba(0,0,0,0.12); }
        .stat-icon {
            width: 60px; height: 60px;
            background: linear-gradient(135deg, #e67e22, #d35400);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: white;
        }
        .stat-info h3 { font-size: 32px; font-weight: 800; color: #333; }
        .stat-info p { color: #999; font-size: 13px; margin-top: 5px; }

        .card {
            background: white;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }
        .card-header h2 { font-size: 20px; display: flex; align-items: center; gap: 10px; }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 500; color: #555; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-family: inherit;
            transition: all 0.3s ease;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none;
            border-color: #e67e22;
        }
        .checkbox-group {
            display: flex;
            gap: 20px;
            margin: 15px 0;
            flex-wrap: wrap;
        }
        .checkbox-group label { display: flex; align-items: center; gap: 8px; font-weight: normal; cursor: pointer; }
        .submit-btn {
            background: linear-gradient(135deg, #27ae60, #1e8449);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .submit-btn:hover { transform: translateY(-2px); }

        .search-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 20px;
        }
        .search-box {
            display: flex;
            align-items: center;
            background: #f8f9fa;
            border-radius: 50px;
            padding: 8px 20px;
            gap: 10px;
            flex: 1;
            max-width: 350px;
        }
        .search-box input { border: none; background: none; outline: none; width: 100%; }
        .filter-select {
            padding: 8px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 50px;
            background: white;
            cursor: pointer;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }
        .product-item {
            background: #f8f9fa;
            border-radius: 16px;
            padding: 15px;
            transition: all 0.3s ease;
        }
        .product-item:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .product-item-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }
        .product-item-emoji { font-size: 40px; }
        .product-item-title { font-weight: bold; font-size: 15px; flex: 1; }
        .product-item-price { color: #e74c3c; font-weight: bold; }
        .product-item-actions {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }
        .edit-btn {
            background: #3498db;
            color: white;
            border: none;
            padding: 6px 15px;
            border-radius: 30px;
            cursor: pointer;
        }
        .delete-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 6px 15px;
            border-radius: 30px;
            cursor: pointer;
        }
        .amazing-btn {
            background: #f39c12;
            color: white;
            border: none;
            padding: 6px 15px;
            border-radius: 30px;
            cursor: pointer;
        }
        .amazing-badge {
            background: #f39c12;
            color: white;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 11px;
            display: inline-block;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 30px;
            background: #27ae60;
            color: white;
            padding: 10px 20px;
            border-radius: 50px;
            z-index: 2000;
            transform: translateX(-400px);
            transition: transform 0.3s;
        }
        .toast.show { transform: translateX(0); }
        .toast.error { background: #e74c3c; }

        @media (max-width: 768px) {
            .container { padding: 10px; }
            .header { flex-direction: column; text-align: center; }
            .products-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="logo" onclick="window.location.href='shop.html'">
            <div class="logo-icon"><i class="fas fa-hard-hat"></i></div>
            <h1>مدیریت <span>محصولات</span></h1>
        </div>
        <div class="user-info">
            <div class="admin-badge"><i class="fas fa-user-cog"></i> <span id="adminName"></span></div>
            <a href="manage-reviews.html" class="btn btn-review"><i class="fas fa-comments"></i> مدیریت نظرات</a>
            <a href="shop.html" class="btn btn-shop"><i class="fas fa-store"></i> فروشگاه</a>
            <button class="btn logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> خروج</button>
        </div>
    </div>

    <div class="stats-grid">
        <div class="stat-card"><div class="stat-icon"><i class="fas fa-boxes"></i></div><div class="stat-info"><h3 id="totalProducts">0</h3><p>کل محصولات</p></div></div>
        <div class="stat-card"><div class="stat-icon"><i class="fas fa-cube"></i></div><div class="stat-info"><h3 id="cementProducts">0</h3><p>سیمان</p></div></div>
        <div class="stat-card"><div class="stat-icon"><i class="fas fa-th-large"></i></div><div class="stat-info"><h3 id="blockProducts">0</h3><p>بلوک</p></div></div>
        <div class="stat-card"><div class="stat-icon"><i class="fas fa-bolt"></i></div><div class="stat-info"><h3 id="amazingProducts">0</h3><p>شگفت‌انگیزها</p></div></div>
    </div>

    <div class="card">
        <div class="card-header"><h2><i class="fas fa-plus-circle"></i> افزودن محصول جدید</h2></div>
        <div class="form-grid">
            <div class="form-group"><label>دسته‌بندی</label><select id="productCategory"><option value="cement">🧱 سیمان</option><option value="block">🔲 بلوک</option><option value="brick">🧱 آجر</option><option value="steel">📐 تیرآهن</option><option value="roof">🏠 سقف</option><option value="tile">🔲 کاشی</option><option value="wood">🌲 چوب</option><option value="door">🚪 درب و پنجره</option><option value="paint">🎨 رنگ</option><option value="tools">🔧 ابزارآلات</option></select></div>
            <div class="form-group"><label>نام محصول</label><input type="text" id="productName" placeholder="نام محصول"></div>
            <div class="form-group"><label>قیمت (تومان)</label><input type="number" id="productPrice" placeholder="قیمت"></div>
            <div class="form-group"><label>قیمت قبلی</label><input type="number" id="productOldPrice" placeholder="قیمت قبل از تخفیف"></div>
            <div class="form-group"><label>توضیحات</label><textarea id="productDesc" rows="3" placeholder="توضیحات محصول"></textarea></div>
            <div class="form-group"><label>موجودی</label><input type="number" id="productStock" value="100"></div>
        </div>
        <div class="checkbox-group">
            <label><input type="checkbox" id="productIsNew"> 🆕 محصول جدید</label>
            <label><input type="checkbox" id="productIsAmazing"> 🔥 محصول شگفت‌انگیز</label>
        </div>
        <button class="submit-btn" onclick="addProduct()"><i class="fas fa-save"></i> ذخیره محصول</button>
    </div>

    <div class="card">
        <div class="card-header"><h2><i class="fas fa-edit"></i> لیست محصولات</h2></div>
        <div class="search-bar">
            <div class="search-box"><i class="fas fa-search"></i><input type="text" id="searchProduct" placeholder="جستجوی محصول..."></div>
            <select id="filterCategory" class="filter-select"><option value="all">همه دسته‌بندی‌ها</option><option value="cement">سیمان</option><option value="block">بلوک</option><option value="brick">آجر</option><option value="steel">تیرآهن</option><option value="roof">سقف</option><option value="tile">کاشی</option><option value="wood">چوب</option><option value="door">درب و پنجره</option><option value="paint">رنگ</option><option value="tools">ابزارآلات</option></select>
        </div>
        <div class="products-grid" id="productsGrid"></div>
    </div>
</div>

<div class="toast" id="toast"><i class="fas fa-check-circle"></i> <span id="toastMsg"></span></div>

<script>
    const STORAGE_KEY = 'barman_products';
    let products = [];

    function getDefaultProducts() {
        return [
            { id: 1, name: "سیمان تیپ 2 (کیسه 50 کیلویی)", price: 85000, oldPrice: 95000, category: "cement", emoji: "🧱", rating: 4.8, reviews: 124, desc: "سیمان پرتلند تیپ 2", isNew: true, isAmazing: true, stock: 500, imageData: null },
            { id: 2, name: "بلوک سبک سیمانی (20*20*40)", price: 12000, oldPrice: 15000, category: "block", emoji: "🔲", rating: 4.6, reviews: 89, desc: "بلوک سیمانی سبک", isNew: false, isAmazing: false, stock: 1000, imageData: null },
            { id: 3, name: "آجر نسوز (قرمز)", price: 3500, oldPrice: 4500, category: "brick", emoji: "🧱", rating: 4.7, reviews: 156, desc: "آجر نسوز درجه یک", isNew: false, isAmazing: false, stock: 2000, imageData: null },
            { id: 4, name: "تیرآهن IPE 14 (سایز 14)", price: 1850000, oldPrice: 2100000, category: "steel", emoji: "📐", rating: 4.9, reviews: 67, desc: "تیرآهن IPE 14 استاندارد", isNew: true, isAmazing: true, stock: 150, imageData: null },
            { id: 5, name: "کاشی کف 60*60 (مات)", price: 180000, oldPrice: 220000, category: "tile", emoji: "🔲", rating: 4.7, reviews: 189, desc: "کاشی کف طرح سنگ", isNew: false, isAmazing: false, stock: 400, imageData: null },
            { id: 6, name: "چوب روسی (درجه 1)", price: 850000, oldPrice: 1000000, category: "wood", emoji: "🌲", rating: 4.8, reviews: 98, desc: "چوب روسی مرغوب", isNew: true, isAmazing: true, stock: 80, imageData: null }
        ];
    }

    function loadProducts() {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved && JSON.parse(saved).length > 0) products = JSON.parse(saved);
        else products = getDefaultProducts();
        updateStats();
        renderProducts();
    }

    function saveProducts() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(products));
        localStorage.setItem('products_updated', Date.now().toString());
        updateStats();
        renderProducts();
        showToast('تغییرات ذخیره شد');
    }

    function updateStats() {
        document.getElementById('totalProducts').innerText = products.length;
        document.getElementById('cementProducts').innerText = products.filter(p => p.category === 'cement').length;
        document.getElementById('blockProducts').innerText = products.filter(p => p.category === 'block').length;
        document.getElementById('amazingProducts').innerText = products.filter(p => p.isAmazing).length;
    }

    function addProduct() {
        const name = document.getElementById('productName').value.trim();
        const price = parseInt(document.getElementById('productPrice').value);
        const oldPrice = parseInt(document.getElementById('productOldPrice').value) || null;
        const category = document.getElementById('productCategory').value;
        const desc = document.getElementById('productDesc').value.trim();
        const stock = parseInt(document.getElementById('productStock').value) || 100;
        const isNew = document.getElementById('productIsNew').checked;
        const isAmazing = document.getElementById('productIsAmazing').checked;
        
        if (!name || !price || !desc) {
            showToast('لطفاً نام، قیمت و توضیحات را پر کنید!', 'error');
            return;
        }
        
        const emojiMap = { cement:"🧱", block:"🔲", brick:"🧱", steel:"📐", roof:"🏠", tile:"🔲", wood:"🌲", door:"🚪", paint:"🎨", tools:"🔧" };
        const newId = Math.max(...products.map(p => p.id), 0) + 1;
        
        products.push({
            id: newId, name: name, price: price, oldPrice: oldPrice, category: category,
            desc: desc, stock: stock, rating: 4.5, reviews: 0, emoji: emojiMap[category] || "📦",
            isNew: isNew, isAmazing: isAmazing, imageData: null
        });
        
        saveProducts();
        clearForm();
        showToast(`✅ محصول "${name}" اضافه شد!`);
    }

    function clearForm() {
        document.getElementById('productName').value = '';
        document.getElementById('productPrice').value = '';
        document.getElementById('productOldPrice').value = '';
        document.getElementById('productDesc').value = '';
        document.getElementById('productStock').value = '100';
        document.getElementById('productIsNew').checked = false;
        document.getElementById('productIsAmazing').checked = false;
    }

    function toggleAmazing(id) {
        const product = products.find(p => p.id === id);
        if (product) {
            product.isAmazing = !product.isAmazing;
            saveProducts();
            showToast(`${product.name} ${product.isAmazing ? 'به شگفت‌انگیزها اضافه شد 🔥' : 'از شگفت‌انگیزها حذف شد'}`);
        }
    }

    function deleteProduct(id) {
        const product = products.find(p => p.id === id);
        if (confirm(`⚠️ آیا از حذف محصول "${product.name}" اطمینان دارید؟`)) {
            products = products.filter(p => p.id !== id);
            saveProducts();
            showToast(`🗑 محصول "${product.name}" حذف شد!`);
        }
    }

    function editProduct(id) {
        const product = products.find(p => p.id === id);
        if (!product) return;
        
        const newName = prompt('نام جدید:', product.name);
        if (newName) product.name = newName;
        const newPrice = prompt('قیمت جدید:', product.price);
        if (newPrice) product.price = parseInt(newPrice);
        const newStock = prompt('موجودی جدید:', product.stock);
        if (newStock) product.stock = parseInt(newStock);
        
        saveProducts();
        showToast(`✅ محصول "${product.name}" ویرایش شد!`);
    }

    function renderProducts() {
        let filtered = [...products];
        const search = document.getElementById('searchProduct').value.toLowerCase();
        const category = document.getElementById('filterCategory').value;
        
        if (search) filtered = filtered.filter(p => p.name.toLowerCase().includes(search));
        if (category !== 'all') filtered = filtered.filter(p => p.category === category);
        
        const grid = document.getElementById('productsGrid');
        if (filtered.length === 0) {
            grid.innerHTML = '<div style="text-align:center; padding:40px; color:#999;"><i class="fas fa-box-open" style="font-size:50px;"></i><p>محصولی یافت نشد</p></div>';
            return;
        }
        
        grid.innerHTML = filtered.map(p => `
            <div class="product-item">
                <div class="product-item-header">
                    <div class="product-item-emoji">${p.emoji}</div>
                    <div class="product-item-title">${p.name}</div>
                    <div class="product-item-price">${p.price.toLocaleString()} تومان</div>
                </div>
                <div style="font-size:12px; color:#999; margin-bottom:8px;">
                    دسته: ${getCategoryName(p.category)} | موجودی: ${p.stock} | امتیاز: ${p.rating}
                    ${p.isAmazing ? '<span class="amazing-badge">🔥 شگفت‌انگیز</span>' : ''}
                    ${p.isNew ? '<span class="amazing-badge" style="background:#27ae60;">🆕 جدید</span>' : ''}
                </div>
                <div class="product-item-actions">
                    <button class="edit-btn" onclick="editProduct(${p.id})"><i class="fas fa-edit"></i> ویرایش</button>
                    <button class="delete-btn" onclick="deleteProduct(${p.id})"><i class="fas fa-trash"></i> حذف</button>
                    <button class="amazing-btn" onclick="toggleAmazing(${p.id})"><i class="fas fa-bolt"></i> ${p.isAmazing ? 'حذف از شگفت‌انگیز' : 'اضافه به شگفت‌انگیز'}</button>
                </div>
            </div>
        `).join('');
    }

    function getCategoryName(cat) {
        const names = { cement: 'سیمان', block: 'بلوک', brick: 'آجر', steel: 'تیرآهن', roof: 'سقف', tile: 'کاشی', wood: 'چوب', door: 'درب و پنجره', paint: 'رنگ', tools: 'ابزارآلات' };
        return names[cat] || cat;
    }

    function showToast(msg, type = 'success') {
        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toastMsg');
        toastMsg.innerText = msg;
        toast.classList.add('show');
        if (type === 'error') toast.classList.add('error');
        else toast.classList.remove('error');
        setTimeout(() => toast.classList.remove('show'), 2000);
    }

    function logout() {
        localStorage.removeItem('panel_logged_in');
        localStorage.removeItem('panel_user');
        window.location.href = 'enter-panel.html';
    }

    function checkLogin() {
        if (!localStorage.getItem('panel_logged_in')) {
            window.location.href = 'enter-panel.html';
        }
        document.getElementById('adminName').innerText = localStorage.getItem('panel_user') || 'مدیر';
    }

    document.getElementById('searchProduct').addEventListener('input', () => renderProducts());
    document.getElementById('filterCategory').addEventListener('change', () => renderProducts());

    checkLogin();
    loadProducts();
</script>
</body>
</html>
