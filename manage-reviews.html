<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدیریت نظرات | بارمان مرکب کویر</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Tahoma', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e8ecf1 100%);
            min-height: 100vh;
            direction: rtl;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        .header {
            background: white;
            border-radius: 20px;
            padding: 18px 30px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        .logo { display: flex; align-items: center; gap: 12px; cursor: pointer; }
        .logo-icon {
            width: 48px; height: 48px;
            background: linear-gradient(135deg, #e67e22, #d35400);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
        }
        .logo h1 { font-size: 22px; color: #333; }
        .logo h1 span { color: #e67e22; }
        .user-info { display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }
        .admin-badge {
            background: linear-gradient(135deg, #e67e22, #d35400);
            color: white;
            padding: 8px 20px;
            border-radius: 40px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
        }
        .btn {
            background: #e67e22;
            color: white;
            border: none;
            padding: 8px 22px;
            border-radius: 40px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn:hover { transform: translateY(-2px); background: #d35400; }
        .btn-product { background: #27ae60; }
        .btn-product:hover { background: #1e8449; }
        .btn-shop { background: #3498db; }
        .btn-shop:hover { background: #2980b9; }
        .logout-btn { background: #e74c3c; }
        .logout-btn:hover { background: #c0392b; }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: white;
            border-radius: 20px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 18px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            transition: all 0.3s ease;
        }
        .stat-card:hover { transform: translateY(-5px); box-shadow: 0 15px 35px rgba(0,0,0,0.12); }
        .stat-icon {
            width: 60px; height: 60px;
            background: linear-gradient(135deg, #e67e22, #d35400);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: white;
        }
        .stat-info h3 { font-size: 32px; font-weight: 800; color: #333; }
        .stat-info p { color: #999; font-size: 13px; margin-top: 5px; }

        .filters {
            background: white;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }
        .search-box {
            display: flex;
            align-items: center;
            background: #f8f9fa;
            border-radius: 50px;
            padding: 8px 20px;
            gap: 10px;
            flex: 1;
            max-width: 350px;
        }
        .search-box input { border: none; background: none; outline: none; width: 100%; }
        .filter-select {
            padding: 8px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 50px;
            background: white;
            cursor: pointer;
        }

        .reviews-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .review-card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            transition: all 0.3s ease;
            box-shadow: 0 3px 10px rgba(0,0,0,0.05);
        }
        .review-card:hover { transform: translateX(-5px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .review-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid #f0f0f0;
        }
        .review-user {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .review-user i { font-size: 40px; color: #e67e22; }
        .review-user-info h4 { font-size: 15px; }
        .review-user-info span { font-size: 11px; color: #999; }
        .review-stars { color: #f39c12; font-size: 14px; }
        .review-product {
            background: #f8f9fa;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .review-text { color: #555; line-height: 1.6; margin-top: 12px; }
        .review-actions { display: flex; gap: 10px; margin-top: 15px; }
        .delete-review-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 6px 15px;
            border-radius: 30px;
            cursor: pointer;
        }
        .new-badge {
            background: #f39c12;
            color: white;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 10px;
            margin-right: 10px;
        }
        .empty-state {
            text-align: center;
            padding: 60px;
            background: white;
            border-radius: 20px;
            color: #999;
        }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 30px;
            background: #27ae60;
            color: white;
            padding: 10px 20px;
            border-radius: 50px;
            z-index: 2000;
            transform: translateX(-400px);
            transition: transform 0.3s;
        }
        .toast.show { transform: translateX(0); }
        .toast.error { background: #e74c3c; }
        @media (max-width: 768px) {
            .container { padding: 10px; }
            .header { flex-direction: column; text-align: center; }
            .review-header { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="logo" onclick="window.location.href='shop.html'">
            <div class="logo-icon"><i class="fas fa-hard-hat"></i></div>
            <h1>مدیریت <span>نظرات</span></h1>
        </div>
        <div class="user-info">
            <div class="admin-badge"><i class="fas fa-user-cog"></i> <span id="adminName"></span></div>
            <a href="manage-products.html" class="btn btn-product"><i class="fas fa-box"></i> مدیریت محصولات</a>
            <a href="shop.html" class="btn btn-shop"><i class="fas fa-store"></i> فروشگاه</a>
            <button class="btn logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> خروج</button>
        </div>
    </div>

    <div class="stats-grid">
        <div class="stat-card"><div class="stat-icon"><i class="fas fa-comments"></i></div><div class="stat-info"><h3 id="totalReviews">0</h3><p>کل نظرات</p></div></div>
        <div class="stat-card"><div class="stat-icon"><i class="fas fa-star"></i></div><div class="stat-info"><h3 id="avgRating">0</h3><p>میانگین امتیاز</p></div></div>
        <div class="stat-card"><div class="stat-icon"><i class="fas fa-clock"></i></div><div class="stat-info"><h3 id="newReviews">0</h3><p>نظرات جدید</p></div></div>
        <div class="stat-card"><div class="stat-icon"><i class="fas fa-store"></i></div><div class="stat-info"><h3 id="productsWithReviews">0</h3><p>محصولات دارای نظر</p></div></div>
    </div>

    <div class="filters">
        <div class="search-box"><i class="fas fa-search"></i><input type="text" id="searchReview" placeholder="جستجو در نظرات..."></div>
        <select id="productFilter" class="filter-select"><option value="all">همه محصولات</option></select>
    </div>

    <div class="reviews-grid" id="reviewsGrid"></div>
</div>

<div class="toast" id="toast"><i class="fas fa-check-circle"></i> <span id="toastMsg"></span></div>

<script>
    const STORAGE_KEY = 'barman_products';
    let products = [];
    let allReviews = [];

    function loadProducts() {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) products = JSON.parse(saved);
        else products = [];
        loadAllReviews();
    }

    function loadAllReviews() {
        allReviews = [];
        products.forEach(product => {
            const reviewsKey = `product_reviews_${product.id}`;
            const savedReviews = localStorage.getItem(reviewsKey);
            if (savedReviews) {
                const reviews = JSON.parse(savedReviews);
                reviews.forEach(review => {
                    allReviews.push({
                        ...review,
                        productId: product.id,
                        productName: product.name,
                        productEmoji: product.emoji
                    });
                });
            }
        });
        updateStats();
        renderReviews();
        updateProductFilter();
    }

    function updateStats() {
        document.getElementById('totalReviews').innerText = allReviews.length;
        const avg = allReviews.length > 0 ? (allReviews.reduce((s, r) => s + r.rating, 0) / allReviews.length).toFixed(1) : 0;
        document.getElementById('avgRating').innerText = avg;
        
        const lastWeek = new Date();
        lastWeek.setDate(lastWeek.getDate() - 7);
        const newReviews = allReviews.filter(r => {
            const rDate = new Date(r.date.split('/').map((v, i) => i === 0 ? Number(v) + 1300 : Number(v)).join('/'));
            return rDate > lastWeek;
        }).length;
        document.getElementById('newReviews').innerText = newReviews;
        
        const uniqueProducts = new Set(allReviews.map(r => r.productId)).size;
        document.getElementById('productsWithReviews').innerText = uniqueProducts;
    }

    function updateProductFilter() {
        const select = document.getElementById('productFilter');
        const uniqueProducts = [...new Map(allReviews.map(r => [r.productId, { name: r.productName, emoji: r.productEmoji }])).entries()];
        select.innerHTML = '<option value="all">همه محصولات</option>' + 
            uniqueProducts.map(([id, p]) => `<option value="${id}">${p.emoji} ${p.name}</option>`).join('');
    }

    function renderReviews() {
        let filtered = [...allReviews];
        const search = document.getElementById('searchReview').value.toLowerCase();
        const productId = document.getElementById('productFilter').value;
        
        if (search) filtered = filtered.filter(r => r.name.toLowerCase().includes(search) || r.text.toLowerCase().includes(search));
        if (productId !== 'all') filtered = filtered.filter(r => r.productId == productId);
        
        filtered.sort((a, b) => new Date(b.date) - new Date(a.date));
        
        const grid = document.getElementById('reviewsGrid');
        if (filtered.length === 0) {
            grid.innerHTML = '<div class="empty-state"><i class="fas fa-comment-slash"></i><p>هیچ نظری یافت نشد</p></div>';
            return;
        }
        
        grid.innerHTML = filtered.map(review => `
            <div class="review-card">
                <div class="review-header">
                    <div class="review-user">
                        <i class="fas fa-user-circle"></i>
                        <div class="review-user-info">
                            <h4>${review.name} ${isNewReview(review.date) ? '<span class="new-badge">جدید</span>' : ''}</h4>
                            <span>${review.date}</span>
                        </div>
                    </div>
                    <div>
                        <span class="review-product">${review.productEmoji} ${review.productName}</span>
                        <span class="review-stars" style="margin-right:10px;">${getStarsHtml(review.rating)}</span>
                    </div>
                </div>
                <div class="review-text">${review.text}</div>
                <div class="review-actions">
                    <button class="delete-review-btn" onclick="deleteReview(${review.productId}, ${review.id})"><i class="fas fa-trash"></i> حذف نظر</button>
                </div>
            </div>
        `).join('');
    }

    function isNewReview(dateStr) {
        try {
            const parts = dateStr.split('/');
            const reviewDate = new Date(parseInt(parts[0]) + 1300, parseInt(parts[1]) - 1, parseInt(parts[2]));
            const now = new Date();
            const diffDays = (now - reviewDate) / (1000 * 60 * 60 * 24);
            return diffDays < 7;
        } catch(e) { return false; }
    }

    function getStarsHtml(rating) {
        let stars = '';
        for (let i = 1; i <= 5; i++) {
            if (i <= Math.floor(rating)) stars += '<i class="fas fa-star"></i>';
            else if (i - rating < 0.5) stars += '<i class="fas fa-star-half-alt"></i>';
            else stars += '<i class="far fa-star"></i>';
        }
        return stars;
    }

    function deleteReview(productId, reviewId) {
        if (confirm('آیا از حذف این نظر مطمئن هستید؟')) {
            const reviewsKey = `product_reviews_${productId}`;
            let reviews = JSON.parse(localStorage.getItem(reviewsKey)) || [];
            reviews = reviews.filter(r => r.id !== reviewId);
            localStorage.setItem(reviewsKey, JSON.stringify(reviews));
            
            const product = products.find(p => p.id === productId);
            if (product) {
                const newAvg = reviews.length > 0 ? (reviews.reduce((s, r) => s + r.rating, 0) / reviews.length) : 0;
                product.rating = parseFloat(newAvg.toFixed(1));
                product.reviews = reviews.length;
                localStorage.setItem(STORAGE_KEY, JSON.stringify(products));
                localStorage.setItem('products_updated', Date.now().toString());
            }
            
            loadAllReviews();
            showToast('نظر با موفقیت حذف شد');
        }
    }

    function showToast(msg, type = 'success') {
        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toastMsg');
        toastMsg.innerText = msg;
        toast.classList.add('show');
        if (type === 'error') toast.classList.add('error');
        else toast.classList.remove('error');
        setTimeout(() => toast.classList.remove('show'), 2000);
    }

    function logout() {
        localStorage.removeItem('panel_logged_in');
        localStorage.removeItem('panel_user');
        window.location.href = 'enter-panel.html';
    }

    function checkLogin() {
        if (!localStorage.getItem('panel_logged_in')) {
            window.location.href = 'enter-panel.html';
        }
        document.getElementById('adminName').innerText = localStorage.getItem('panel_user') || 'مدیر';
    }

    document.getElementById('searchReview').addEventListener('input', () => renderReviews());
    document.getElementById('productFilter').addEventListener('change', () => renderReviews());

    checkLogin();
    loadProducts();
</script>
</body>
</html>
