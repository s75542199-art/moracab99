<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>تایید سفارش | فروشگاه فورمو</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6c5ce7;
            --success: #00b894;
            --dark: #2d3436;
            --gray: #b2bec3;
            --light: #f8f9fa;
            --white: #ffffff;
            --shadow-lg: 0 15px 35px rgba(0,0,0,0.12);
            --radius-lg: 20px;
        }

        body {
            font-family: 'Vazirmatn', 'Tahoma', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            direction: rtl;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .success-card {
            max-width: 550px;
            width: 100%;
            background: white;
            border-radius: 30px;
            padding: 50px 40px;
            text-align: center;
            box-shadow: var(--shadow-lg);
            animation: fadeInUp 0.6s ease;
        }

        .success-icon {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, var(--success), #00a884);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 25px;
            animation: pulse 0.5s ease;
        }

        @keyframes pulse {
            0% { transform: scale(0); opacity: 0; }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }

        .success-icon i {
            font-size: 50px;
            color: white;
        }

        .success-card h2 {
            font-size: 28px;
            color: var(--success);
            margin-bottom: 15px;
        }

        .success-card p {
            color: var(--gray);
            margin-bottom: 10px;
            line-height: 1.6;
        }

        .order-id {
            background: var(--light);
            padding: 10px;
            border-radius: 12px;
            margin: 20px 0;
            font-family: monospace;
            font-size: 16px;
        }

        .buttons {
            display: flex;
            gap: 15px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .btn {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            font-weight: bold;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), #a29bfe);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(108,92,231,0.3);
        }

        .btn-secondary {
            background: var(--light);
            color: var(--dark);
        }

        .btn-secondary:hover {
            background: var(--gray);
            color: white;
        }

        @media (max-width: 480px) {
            .success-card {
                padding: 30px 20px;
            }
            .buttons {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
<div class="success-card">
    <div class="success-icon">
        <i class="fas fa-check-circle"></i>
    </div>
    <h2>سفارش شما ثبت شد!</h2>
    <p>سفارش شما با موفقیت ثبت گردید.</p>
    <p>پشتیبانان ما در اسرع وقت با شما تماس خواهند گرفت.</p>
    
    <div class="order-id" id="orderIdDisplay"></div>
    
    <div class="buttons">
        <a href="shop.html" class="btn btn-primary">
            <i class="fas fa-store"></i> ادامه خرید
        </a>
        <a href="profile.html" class="btn btn-secondary">
            <i class="fas fa-list"></i> مشاهده سفارشات
        </a>
    </div>
</div>

<script>
    const lastOrder = localStorage.getItem('lastOrder');
    if (lastOrder) {
        const order = JSON.parse(lastOrder);
        document.getElementById('orderIdDisplay').innerHTML = `شناسه سفارش: <strong>${order.orderId}</strong>`;
    } else {
        document.getElementById('orderIdDisplay').innerHTML = `شناسه سفارش: ثبت شد`;
    }
</script>
</body>
</html>
