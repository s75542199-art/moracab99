<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>مدیریت سفارشات | بارمان مرکب کویر</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Tahoma', sans-serif; background: linear-gradient(135deg, #f5f7fa 0%, #e8ecf1 100%); direction: rtl; padding: 20px; }
        .container { max-width: 1300px; margin: 0 auto; }
        .header { background: white; border-radius: 20px; padding: 18px 30px; margin-bottom: 30px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
        .logo { display: flex; align-items: center; gap: 12px; cursor: pointer; }
        .logo-icon { width: 48px; height: 48px; background: linear-gradient(135deg, #e67e22, #d35400); border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 24px; color: white; }
        .logo h1 { font-size: 22px; color: #333; }
        .user-info { display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }
        .admin-badge { background: linear-gradient(135deg, #e67e22, #d35400); color: white; padding: 8px 20px; border-radius: 40px; display: flex; align-items: center; gap: 10px; font-weight: 600; }
        .btn { background: #e67e22; color: white; border: none; padding: 8px 22px; border-radius: 40px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; font-weight: 600; transition: all 0.3s ease; }
        .btn:hover { transform: translateY(-2px); background: #d35400; }
        .logout-btn { background: #e74c3c; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; border-radius: 20px; padding: 20px; display: flex; align-items: center; gap: 18px; box-shadow: 0 5px 20px rgba(0,0,0,0.08); }
        .stat-icon { width: 60px; height: 60px; background: linear-gradient(135deg, #e67e22, #d35400); border-radius: 18px; display: flex; align-items: center; justify-content: center; font-size: 28px; color: white; }
        .stat-info h3 { font-size: 32px; font-weight: 800; color: #333; }
        .stat-info p { color: #999; font-size: 13px; margin-top: 5px; }
        .filters { background: white; border-radius: 20px; padding: 20px; margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.08); }
        .search-box { display: flex; align-items: center; background: #f8f9fa; border-radius: 50px; padding: 8px 20px; gap: 10px; flex: 1; max-width: 300px; }
        .search-box input { border: none; background: none; outline: none; width: 100%; }
        .filter-select { padding: 8px 20px; border: 2px solid #e0e0e0; border-radius: 50px; background: white; cursor: pointer; }
        .orders-grid { display: flex; flex-direction: column; gap: 20px; }
        .order-card { background: white; border-radius: 20px; padding: 20px; transition: all 0.3s ease; box-shadow: 0 3px 10px rgba(0,0,0,0.05); border-right: 4px solid #e67e22; }
        .order-card:hover { transform: translateX(-5px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .order-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; margin-bottom: 15px; padding-bottom: 12px; border-bottom: 1px solid #f0f0f0; }
        .order-id { font-weight: bold; color: #e67e22; background: #fef5e7; padding: 4px 12px; border-radius: 30px; font-size: 14px; }
        .order-date { font-size: 12px; color: #999; }
        .order-status { padding: 5px 15px; border-radius: 30px; font-size: 12px; font-weight: bold; }
        .status-pending { background: #fff3cd; color: #856404; }
        .status-paid { background: #d4edda; color: #155724; }
        .status-shipped { background: #cce5ff; color: #004085; }
        .status-delivered { background: #d1ecf1; color: #0c5460; }
        .status-cancelled { background: #f8d7da; color: #721c24; }
        .order-body { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-top: 15px; }
        .order-products { border-left: 1px solid #eee; padding-left: 15px; }
        .order-products h4 { font-size: 14px; margin-bottom: 10px; color: #333; }
        .product-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #f5f5f5; font-size: 13px; }
        .product-name { flex: 2; }
        .product-qty { width: 60px; text-align: center; }
        .product-price { width: 100px; text-align: left; color: #e74c3c; }
        .order-info h4 { font-size: 14px; margin-bottom: 10px; color: #333; }
        .order-info p { font-size: 13px; color: #666; margin-bottom: 8px; }
        .order-total { margin-top: 15px; padding-top: 12px; border-top: 1px solid #eee; text-align: left; font-weight: bold; font-size: 16px; color: #e74c3c; }
        .order-actions { margin-top: 15px; display: flex; gap: 10px; justify-content: flex-end; }
        .action-btn { padding: 6px 15px; border: none; border-radius: 25px; cursor: pointer; font-size: 12px; font-weight: 500; transition: all 0.3s ease; }
        .action-confirm { background: #27ae60; color: white; }
        .action-ship { background: #3498db; color: white; }
        .action-deliver { background: #9b59b6; color: white; }
        .action-cancel { background: #e74c3c; color: white; }
        .empty-state { text-align: center; padding: 60px; background: white; border-radius: 20px; color: #999; }
        .toast { position: fixed; bottom: 30px; left: 30px; background: #27ae60; color: white; padding: 10px 20px; border-radius: 50px; z-index: 2000; transform: translateX(-400px); transition: transform 0.3s; }
        .toast.show { transform: translateX(0); }
        @media (max-width: 768px) { .order-body { grid-template-columns: 1fr; } .order-products { border-left: none; border-bottom: 1px solid #eee; padding-left: 0; padding-bottom: 15px; } .header { flex-direction: column; text-align: center; } }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="logo" onclick="window.location.href='shop.html'"><div class="logo-icon"><i class="fas fa-hard-hat"></i></div><h1>مدیریت <span>سفارشات</span></h1></div>
        <div class="user-info"><div class="admin-badge"><i class="fas fa-user-cog"></i> <span id="adminName"></span></div><a href="shop.html" class="btn"><i class="fas fa-store"></i> فروشگاه</a><button class="btn logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> خروج</button></div>
    </div>
    <div class="stats-grid" id="statsGrid"></div>
    <div class="filters"><div class="search-box"><i class="fas fa-search"></i><input type="text" id="searchOrder" placeholder="جستجوی سفارش..."></div><select id="statusFilter" class="filter-select"><option value="all">همه وضعیت‌ها</option><option value="pending">در انتظار پرداخت</option><option value="paid">پرداخت شده</option><option value="shipped">ارسال شده</option><option value="delivered">تحویل شده</option><option value="cancelled">لغو شده</option></select><button class="btn" onclick="refreshOrders()" style="background:#e67e22; padding:8px 15px;"><i class="fas fa-sync-alt"></i> بروزرسانی</button></div>
    <div class="orders-grid" id="ordersGrid"></div>
</div>
<div class="toast" id="toast"><i class="fas fa-check-circle"></i> <span id="toastMsg"></span></div>
<script>
    const ORDERS_KEY = 'barman_orders';
    let orders = [];
    function loadOrders() {
        const saved = localStorage.getItem(ORDERS_KEY);
        orders = saved ? JSON.parse(saved) : [];
        updateStats();
        renderOrders();
    }
    function saveOrders() { localStorage.setItem(ORDERS_KEY, JSON.stringify(orders)); }
    function updateStats() {
        const total = orders.length, pending = orders.filter(o => o.status === 'pending').length, paid = orders.filter(o => o.status === 'paid').length, shipped = orders.filter(o => o.status === 'shipped').length, delivered = orders.filter(o => o.status === 'delivered').length;
        document.getElementById('statsGrid').innerHTML = `<div class="stat-card"><div class="stat-icon"><i class="fas fa-shopping-cart"></i></div><div class="stat-info"><h3>${total}</h3><p>کل سفارشات</p></div></div><div class="stat-card"><div class="stat-icon"><i class="fas fa-clock"></i></div><div class="stat-info"><h3>${pending}</h3><p>در انتظار پرداخت</p></div></div><div class="stat-card"><div class="stat-icon"><i class="fas fa-check-circle"></i></div><div class="stat-info"><h3>${paid}</h3><p>پرداخت شده</p></div></div><div class="stat-card"><div class="stat-icon"><i class="fas fa-truck"></i></div><div class="stat-info"><h3>${shipped}</h3><p>ارسال شده</p></div></div><div class="stat-card"><div class="stat-icon"><i class="fas fa-home"></i></div><div class="stat-info"><h3>${delivered}</h3><p>تحویل شده</p></div></div>`;
    }
    function getStatusText(s) { return { pending:'در انتظار پرداخت', paid:'پرداخت شده', shipped:'ارسال شده', delivered:'تحویل شده', cancelled:'لغو شده' }[s] || s; }
    function getStatusClass(s) { return { pending:'status-pending', paid:'status-paid', shipped:'status-shipped', delivered:'status-delivered', cancelled:'status-cancelled' }[s]; }
    function updateOrderStatus(orderId, newStatus) {
        const order = orders.find(o => o.id === orderId);
        if(order) { order.status = newStatus; saveOrders(); updateStats(); renderOrders(); showToast(`وضعیت سفارش ${orderId} به "${getStatusText(newStatus)}" تغییر کرد`); if(newStatus === 'delivered') setTimeout(() => { orders = orders.filter(o => o.id !== orderId); saveOrders(); updateStats(); renderOrders(); showToast(`سفارش ${orderId} پس از تحویل از لیست خارج شد`); }, 2000); }
    }
    function renderOrders() {
        let filtered = [...orders];
        const search = document.getElementById('searchOrder').value.toLowerCase();
        const status = document.getElementById('statusFilter').value;
        if(search) filtered = filtered.filter(o => o.id.toLowerCase().includes(search) || o.customer.name.includes(search) || o.customer.phone.includes(search));
        if(status !== 'all') filtered = filtered.filter(o => o.status === status);
        filtered.sort((a,b) => b.date.localeCompare(a.date));
        const grid = document.getElementById('ordersGrid');
        if(filtered.length === 0) { grid.innerHTML = '<div class="empty-state"><i class="fas fa-shopping-cart" style="font-size:60px; opacity:0.5;"></i><p>هیچ سفارشی یافت نشد</p></div>'; return; }
        grid.innerHTML = filtered.map(order => `<div class="order-card"><div class="order-header"><div><span class="order-id">#${order.id}</span><span class="order-date"> 📅 ${order.date}</span></div><div><span class="order-status ${getStatusClass(order.status)}">${getStatusText(order.status)}</span></div></div><div class="order-body"><div class="order-products"><h4><i class="fas fa-box"></i> محصولات سفارش</h4>${order.items.map(item => `<div class="product-item"><span class="product-name">${item.name}</span><span class="product-qty">x${item.quantity}</span><span class="product-price">${(item.price * item.quantity).toLocaleString()} تومان</span></div>`).join('')}<div class="order-total">جمع کل: ${order.total.toLocaleString()} تومان</div></div><div class="order-info"><h4><i class="fas fa-user"></i> اطلاعات مشتری</h4><p><i class="fas fa-user"></i> ${order.customer.name}</p><p><i class="fas fa-phone"></i> ${order.customer.phone}</p><p><i class="fas fa-envelope"></i> ${order.customer.email}</p><p><i class="fas fa-map-marker-alt"></i> ${order.address.province}، ${order.address.city}، ${order.address.address}</p><p><i class="fas fa-credit-card"></i> ${order.paymentMethod}</p><p><i class="fas fa-truck"></i> هزینه ارسال: ${order.shipping === 0 ? 'رایگان' : order.shipping.toLocaleString() + ' تومان'}</p></div></div><div class="order-actions">${order.status === 'pending' ? `<button class="action-btn action-confirm" onclick="updateOrderStatus('${order.id}', 'paid')"><i class="fas fa-check"></i> تایید پرداخت</button><button class="action-btn action-cancel" onclick="updateOrderStatus('${order.id}', 'cancelled')"><i class="fas fa-times"></i> لغو</button>` : ''}${order.status === 'paid' ? `<button class="action-btn action-ship" onclick="updateOrderStatus('${order.id}', 'shipped')"><i class="fas fa-truck"></i> ارسال سفارش</button>` : ''}${order.status === 'shipped' ? `<button class="action-btn action-deliver" onclick="updateOrderStatus('${order.id}', 'delivered')"><i class="fas fa-home"></i> تحویل شد</button>` : ''}</div></div>`).join('');
    }
    function refreshOrders() { loadOrders(); showToast('سفارشات بروزرسانی شد'); }
    function showToast(msg, type = 'success') { const t = document.getElementById('toast'); t.querySelector('#toastMsg').innerText = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2000); }
    function logout() { window.location.href = 'orders-login.html'; }
    function checkLogin() { if(!localStorage.getItem('order_logged_in')) window.location.href = 'orders-login.html'; document.getElementById('adminName').innerText = localStorage.getItem('order_user') || 'اپراتور'; }
    document.getElementById('searchOrder').addEventListener('input', () => renderOrders());
    document.getElementById('statusFilter').addEventListener('change', () => renderOrders());
    checkLogin(); loadOrders(); setInterval(refreshOrders, 5000);
</script>
</body>
</html>
