<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>جزئیات محصول | بارمان مرکب کویر</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #ef6b00;
            --primary-dark: #d35400;
            --primary-light: #f39c12;
            --success: #27ae60;
            --danger: #e74c3c;
            --dark: #2d3436;
            --gray: #7f8c8d;
            --light: #f8f9fa;
            --white: #ffffff;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.05);
            --shadow-md: 0 5px 20px rgba(0,0,0,0.08);
            --shadow-lg: 0 15px 35px rgba(0,0,0,0.12);
            --transition: all 0.3s ease;
            --radius: 12px;
            --radius-lg: 20px;
        }
        body {
            font-family: 'Tahoma', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e8ecf1 100%);
            direction: rtl;
            min-height: 100vh;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes zoomIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .header {
            background: white;
            border-radius: var(--radius-lg);
            padding: 15px 25px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            box-shadow: var(--shadow-sm);
            animation: fadeInUp 0.5s ease;
        }
        .logo { display: flex; align-items: center; gap: 10px; cursor: pointer; transition: var(--transition); }
        .logo:hover { transform: scale(1.02); }
        .logo-icon {
            width: 45px; height: 45px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
        }
        .logo h1 { font-size: 22px; color: #333; }
        .nav-links { display: flex; gap: 20px; }
        .nav-links a { text-decoration: none; color: #666; transition: var(--transition); }
        .nav-links a:hover { color: var(--primary); }
        .back-btn {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 30px;
            cursor: pointer;
            transition: var(--transition);
        }
        .back-btn:hover { transform: translateY(-2px); }
        .breadcrumb {
            background: white;
            border-radius: var(--radius);
            padding: 12px 20px;
            margin-bottom: 25px;
            font-size: 13px;
            animation: fadeInUp 0.6s ease;
        }
        .breadcrumb a { color: var(--gray); text-decoration: none; }
        .breadcrumb a:hover { color: var(--primary); }
        .product-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            background: white;
            border-radius: var(--radius-lg);
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: var(--shadow-lg);
            animation: zoomIn 0.5s ease;
        }
        .gallery-main {
            width: 100%;
            height: 400px;
            background: var(--light);
            border-radius: var(--radius-lg);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .gallery-main img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .gallery-main span { font-size: 100px; }
        .gallery-thumbs {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            overflow-x: auto;
        }
        .thumb {
            width: 80px;
            height: 80px;
            background: var(--light);
            border-radius: var(--radius);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            border: 2px solid transparent;
        }
        .thumb.active { border-color: var(--primary); transform: scale(1.05); }
        .product-title { font-size: 24px; color: #333; margin-bottom: 10px; }
        .product-price {
            display: flex;
            align-items: baseline;
            gap: 15px;
            margin: 15px 0;
            padding: 15px 0;
            border-top: 1px solid #eee;
            border-bottom: 1px solid #eee;
        }
        .current-price { color: var(--danger); font-size: 28px; font-weight: bold; }
        .old-price { color: var(--gray); font-size: 16px; text-decoration: line-through; }
        .discount-badge {
            background: var(--danger);
            color: white;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 14px;
        }
        .rating { display: flex; align-items: center; gap: 10px; margin: 15px 0; }
        .stars { color: #f39c12; font-size: 18px; }
        .rating-count { color: var(--gray); font-size: 13px; }
        .stock {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 30px;
            font-size: 13px;
            margin: 15px 0;
        }
        .stock.available { background: #e8f8f5; color: var(--success); }
        .stock.unavailable { background: #fee; color: var(--danger); }
        .product-desc { color: #666; line-height: 1.8; margin: 15px 0; padding: 15px 0; border-top: 1px solid #eee; }
        .product-actions { display: flex; gap: 15px; margin-top: 20px; flex-wrap: wrap; }
        .add-to-cart-btn {
            flex: 2;
            background: linear-gradient(135deg, var(--success), #1e8449);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: var(--transition);
        }
        .add-to-cart-btn:hover { transform: translateY(-3px); }
        .wishlist-btn {
            flex: 1;
            background: white;
            border: 2px solid #ddd;
            padding: 12px;
            border-radius: 50px;
            cursor: pointer;
            transition: var(--transition);
        }
        .wishlist-btn.active { border-color: var(--danger); color: var(--danger); }
        .buy-now-btn {
            flex: 2;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border: none;
            padding: 14px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: var(--transition);
        }
        .buy-now-btn:hover { transform: translateY(-3px); }
        .quantity-selector { display: flex; align-items: center; gap: 10px; margin: 15px 0; }
        .quantity-btn {
            width: 35px;
            height: 35px;
            background: var(--light);
            border: none;
            border-radius: 10px;
            font-size: 20px;
            cursor: pointer;
            transition: var(--transition);
        }
        .quantity-btn:hover { background: var(--primary); color: white; }
        .quantity-input { width: 60px; height: 35px; text-align: center; border: 1px solid #ddd; border-radius: 10px; }
        .reviews-section {
            background: white;
            border-radius: var(--radius-lg);
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: var(--shadow-lg);
            animation: fadeInUp 0.7s ease;
        }
        .reviews-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }
        .reviews-header h2 { font-size: 20px; }
        .add-review-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 30px;
            cursor: pointer;
            transition: var(--transition);
        }
        .add-review-btn:hover { transform: translateY(-2px); background: var(--primary-dark); }
        .reviews-list { max-height: 400px; overflow-y: auto; }
        .review-card {
            padding: 20px;
            border-bottom: 1px solid #eee;
            background: #fff;
            transition: var(--transition);
            animation: fadeInUp 0.3s ease;
            animation-fill-mode: both;
        }
        .review-card:hover { background: #fafafa; transform: translateX(-5px); }
        .review-user { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
        .review-user i { font-size: 40px; color: var(--primary); }
        .review-user-info h4 { font-size: 14px; }
        .review-user-info span { font-size: 11px; color: var(--gray); }
        .review-stars { color: #f39c12; font-size: 13px; margin: 5px 0; }
        .review-text { color: #666; line-height: 1.6; margin-top: 10px; }
        .empty-reviews { text-align: center; padding: 40px; color: var(--gray); }
        .similar-section {
            background: white;
            border-radius: var(--radius-lg);
            padding: 30px;
            box-shadow: var(--shadow-lg);
            animation: fadeInUp 0.8s ease;
        }
        .similar-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }
        .similar-card {
            background: var(--light);
            border-radius: 15px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            animation: zoomIn 0.4s ease;
            animation-fill-mode: both;
        }
        .similar-card:hover { transform: translateY(-5px); box-shadow: var(--shadow-md); }
        .similar-img { font-size: 50px; }
        .similar-name { font-size: 13px; font-weight: bold; margin: 8px 0; }
        .similar-price { color: var(--danger); font-size: 14px; font-weight: bold; }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            animation: fadeInUp 0.3s ease;
        }
        .modal.show { display: flex; }
        .modal-content {
            background: white;
            border-radius: 25px;
            padding: 30px;
            width: 90%;
            max-width: 500px;
            animation: zoomIn 0.3s ease;
        }
        .rating-input { display: flex; gap: 10px; margin: 15px 0; font-size: 30px; cursor: pointer; }
        .rating-input i { color: #ddd; transition: var(--transition); }
        .rating-input i.active { color: #f39c12; }
        .footer {
            background: var(--dark);
            color: white;
            padding: 30px;
            border-radius: var(--radius-lg);
            text-align: center;
            margin-top: 30px;
            animation: fadeInUp 0.9s ease;
        }
        .footer a { color: #b2bec3; text-decoration: none; margin: 0 10px; transition: var(--transition); }
        .footer a:hover { color: var(--primary); transform: translateY(-2px); }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 30px;
            background: var(--success);
            color: white;
            padding: 10px 20px;
            border-radius: 50px;
            z-index: 3000;
            transform: translateX(-400px);
            transition: transform 0.3s;
        }
        .toast.show { transform: translateX(0); }
        .toast.error { background: var(--danger); }
        @media (max-width: 768px) {
            .product-grid { grid-template-columns: 1fr; }
            .gallery-main { height: 250px; }
            .container { padding: 15px; }
            .header { flex-direction: column; text-align: center; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="logo" onclick="window.location.href='shop.html'">
            <div class="logo-icon"><i class="fas fa-hard-hat"></i></div>
            <h1>بارمان مرکب کویر</h1>
        </div>
        <div class="nav-links">
            <a href="shop.html">فروشگاه</a>
            <a href="about.html">درباره ما</a>
            <a href="contact.html">تماس با ما</a>
        </div>
        <button class="back-btn" onclick="window.location.href='shop.html'">
            <i class="fas fa-arrow-right"></i> بازگشت
        </button>
    </div>

    <div class="breadcrumb">
        <a href="shop.html">خانه</a> / <a href="shop.html">فروشگاه</a> / <span id="breadcrumbCategory"></span> / <span id="breadcrumbName"></span>
    </div>

    <div id="productContainer">
        <div class="product-grid">
            <div>
                <div class="gallery-main" id="mainImage"></div>
                <div class="gallery-thumbs" id="thumbnails"></div>
            </div>
            <div>
                <h1 class="product-title" id="productName"></h1>
                <div class="rating" id="productRating"></div>
                <div class="product-price" id="productPrice"></div>
                <div class="stock" id="productStock"></div>
                <div class="quantity-selector">
                    <button class="quantity-btn" onclick="changeQty(-1)">-</button>
                    <input type="number" class="quantity-input" id="quantity" value="1" min="1">
                    <button class="quantity-btn" onclick="changeQty(1)">+</button>
                </div>
                <div class="product-actions">
                    <button class="add-to-cart-btn" onclick="addToCart()"><i class="fas fa-shopping-cart"></i> افزودن به سبد خرید</button>
                    <button class="wishlist-btn" id="wishlistBtn" onclick="toggleWishlist()"><i class="far fa-heart"></i> علاقه‌مندی</button>
                </div>
                <div class="product-actions">
                    <button class="buy-now-btn" onclick="buyNow()"><i class="fas fa-bolt"></i> خرید سریع</button>
                </div>
                <div class="product-desc" id="productDesc"></div>
            </div>
        </div>
    </div>

    <div class="reviews-section">
        <div class="reviews-header">
            <h2><i class="fas fa-comments"></i> نظرات کاربران (<span id="reviewsCount">0</span>)</h2>
            <button class="add-review-btn" onclick="openReviewModal()"><i class="fas fa-plus"></i> افزودن نظر</button>
        </div>
        <div class="reviews-list" id="reviewsList"></div>
    </div>

    <div class="similar-section" id="similarSection" style="display: none;">
        <h2><i class="fas fa-tags"></i> محصولات مشابه</h2>
        <div class="similar-grid" id="similarProducts"></div>
    </div>

    <div class="footer">
        <p>© ۱۴۰۳ بارمان مرکب کویر - تمامی حقوق محفوظ است</p>
        <p style="margin-top: 10px;">
            <a href="about.html">درباره ما</a>
            <a href="contact.html">تماس با ما</a>
            <a href="faq.html">سوالات متداول</a>
            <a href="terms.html">قوانین</a>
            <a href="returns.html">بازگشت کالا</a>
            <a href="shipping.html">شیوه‌های ارسال</a>
        </p>
    </div>
</div>

<div id="reviewModal" class="modal">
    <div class="modal-content">
        <div class="modal-header" style="display:flex; justify-content:space-between; margin-bottom:20px;">
            <h3><i class="fas fa-star"></i> ثبت نظر و امتیاز</h3>
            <button class="close-modal" onclick="closeReviewModal()" style="background:none; border:none; font-size:24px; cursor:pointer;">&times;</button>
        </div>
        <div class="form-group"><label>نام شما</label><input type="text" id="reviewerName" placeholder="نام خود را وارد کنید" style="width:100%; padding:10px; border-radius:10px; border:1px solid #ddd;"></div>
        <div class="form-group">
            <label>امتیاز شما</label>
            <div class="rating-input" id="ratingStars">
                <i class="far fa-star" data-rating="1"></i>
                <i class="far fa-star" data-rating="2"></i>
                <i class="far fa-star" data-rating="3"></i>
                <i class="far fa-star" data-rating="4"></i>
                <i class="far fa-star" data-rating="5"></i>
            </div>
            <input type="hidden" id="reviewRating" value="0">
        </div>
        <div class="form-group"><label>نظر شما</label><textarea id="reviewText" rows="4" placeholder="نظر خود را بنویسید..." style="width:100%; padding:10px; border-radius:10px; border:1px solid #ddd;"></textarea></div>
        <button class="submit-btn" onclick="submitReview()" style="width:100%; background:linear-gradient(135deg, #ef6b00, #d35400); color:white; border:none; padding:12px; border-radius:30px; cursor:pointer; margin-top:10px;">ثبت نظر</button>
    </div>
</div>

<div class="toast" id="toast"><span id="toastMsg"></span></div>

<script>
    const STORAGE_KEY = 'barman_products';
    let products = [], currentProduct = null, currentProductId = null, currentRating = 0, cart = [], wishlist = [];

    function getProductIdFromUrl() { const params = new URLSearchParams(window.location.search); return parseInt(params.get('id')); }
    function loadProducts() { const saved = localStorage.getItem(STORAGE_KEY); if (saved) products = JSON.parse(saved); else products = []; loadProduct(); }
    function loadProduct() {
        currentProductId = getProductIdFromUrl();
        if (!currentProductId) { window.location.href = 'shop.html'; return; }
        currentProduct = products.find(p => p.id === currentProductId);
        if (!currentProduct) { window.location.href = 'shop.html'; return; }
        displayProduct(); loadReviews(); loadSimilarProducts(); loadWishlistStatus();
    }
    function displayProduct() {
        document.getElementById('productName').innerText = currentProduct.name;
        document.getElementById('breadcrumbName').innerText = currentProduct.name;
        let priceHtml = `<span class="current-price">${currentProduct.price.toLocaleString()} تومان</span>`;
        if (currentProduct.oldPrice) {
            priceHtml += `<span class="old-price">${currentProduct.oldPrice.toLocaleString()} تومان</span>`;
            const discount = Math.round(((currentProduct.oldPrice - currentProduct.price) / currentProduct.oldPrice) * 100);
            priceHtml += `<span class="discount-badge">${discount}٪ تخفیف</span>`;
        }
        document.getElementById('productPrice').innerHTML = priceHtml;
        let stars = ''; for (let i = 1; i <= 5; i++) stars += i <= Math.floor(currentProduct.rating) ? '<i class="fas fa-star"></i>' : (i - currentProduct.rating < 0.5 ? '<i class="fas fa-star-half-alt"></i>' : '<i class="far fa-star"></i>');
        document.getElementById('productRating').innerHTML = `<div class="stars">${stars}</div><span class="rating-count">(${currentProduct.reviews || 0} نظر)</span>`;
        const stockAvailable = currentProduct.stock > 0;
        document.getElementById('productStock').innerHTML = `<span class="stock ${stockAvailable ? 'available' : 'unavailable'}"><i class="fas ${stockAvailable ? 'fa-check-circle' : 'fa-times-circle'}"></i> ${stockAvailable ? `موجود در انبار (${currentProduct.stock} عدد)` : 'ناموجود'}</span>`;
        document.getElementById('productDesc').innerHTML = `<strong>توضیحات محصول:</strong><br>${currentProduct.desc}`;
        const mainDiv = document.getElementById('mainImage');
        if (currentProduct.imageData) { mainDiv.innerHTML = `<img src="${currentProduct.imageData}" alt="${currentProduct.name}">`; }
        else { mainDiv.innerHTML = `<span>${currentProduct.emoji}</span>`; }
        const thumbImages = [currentProduct.imageData ? currentProduct.imageData : null, null, null, null];
        const thumbEmojis = [currentProduct.emoji, "🧱", "🏗️", "📦"];
        document.getElementById('thumbnails').innerHTML = thumbEmojis.map((emoji, i) => `<div class="thumb" onclick="changeImage(${i})">${thumbImages[i] ? `<img src="${thumbImages[i]}">` : `<span>${emoji}</span>`}</div>`).join('');
    }
    function changeImage(index) {
        const mainDiv = document.getElementById('mainImage');
        const thumbs = document.querySelectorAll('.thumb');
        thumbs.forEach((thumb, i) => thumb.classList.toggle('active', i === index));
        if (index === 0 && currentProduct.imageData) { mainDiv.innerHTML = `<img src="${currentProduct.imageData}" alt="${currentProduct.name}">`; }
        else { const emojis = [currentProduct.emoji, "🧱", "🏗️", "📦"]; mainDiv.innerHTML = `<span>${emojis[index]}</span>`; }
    }
    let quantity = 1;
    function changeQty(delta) { quantity += delta; if (quantity < 1) quantity = 1; if (currentProduct && quantity > currentProduct.stock) quantity = currentProduct.stock; document.getElementById('quantity').value = quantity; }
    function addToCart() { cart = JSON.parse(localStorage.getItem('barman_cart')) || []; const existing = cart.find(i => i.id === currentProduct.id); if (existing) { existing.quantity += quantity; showToast(currentProduct.name + ' +' + quantity); } else { cart.push({ ...currentProduct, quantity: quantity }); showToast(currentProduct.name + ' به سبد اضافه شد'); } localStorage.setItem('barman_cart', JSON.stringify(cart)); updateCartCount(); }
    function buyNow() { addToCart(); setTimeout(() => window.location.href = 'checkout.html', 500); }
    function toggleWishlist() { wishlist = JSON.parse(localStorage.getItem('barman_wishlist')) || []; if (wishlist.includes(currentProduct.id)) { wishlist = wishlist.filter(id => id !== currentProduct.id); showToast('از علاقه‌مندی‌ها حذف شد'); } else { wishlist.push(currentProduct.id); showToast('به علاقه‌مندی‌ها اضافه شد'); } localStorage.setItem('barman_wishlist', JSON.stringify(wishlist)); loadWishlistStatus(); }
    function loadWishlistStatus() { wishlist = JSON.parse(localStorage.getItem('barman_wishlist')) || []; const btn = document.getElementById('wishlistBtn'); if (wishlist.includes(currentProduct.id)) { btn.classList.add('active'); btn.innerHTML = '<i class="fas fa-heart"></i> حذف از علاقه‌مندی'; } else { btn.classList.remove('active'); btn.innerHTML = '<i class="far fa-heart"></i> علاقه‌مندی'; } }
    function loadReviews() { const reviews = JSON.parse(localStorage.getItem(`product_reviews_${currentProduct.id}`)) || []; document.getElementById('reviewsCount').innerText = reviews.length; const reviewsList = document.getElementById('reviewsList'); if (reviews.length === 0) { reviewsList.innerHTML = '<div class="empty-reviews"><i class="fas fa-comment-dots" style="font-size:50px; opacity:0.5; margin-bottom:15px; display:block;"></i><p>هنوز نظری ثبت نشده است</p></div>'; return; } reviewsList.innerHTML = reviews.map(r => `<div class="review-card"><div class="review-user"><i class="fas fa-user-circle"></i><div class="review-user-info"><h4>${r.name}</h4><span>${r.date}</span></div></div><div class="review-stars">${getStarsHtml(r.rating)}</div><div class="review-text">${r.text}</div></div>`).join(''); }
    function getStarsHtml(rating) { let stars = ''; for (let i = 1; i <= 5; i++) stars += i <= Math.floor(rating) ? '<i class="fas fa-star"></i>' : (i - rating < 0.5 ? '<i class="fas fa-star-half-alt"></i>' : '<i class="far fa-star"></i>'); return stars; }
    function openReviewModal() { document.getElementById('reviewModal').classList.add('show'); currentRating = 0; document.querySelectorAll('.rating-input i').forEach(star => { star.classList.remove('active', 'fas'); star.classList.add('far'); }); document.getElementById('reviewerName').value = localStorage.getItem('barman_user') || ''; document.getElementById('reviewText').value = ''; }
    function closeReviewModal() { document.getElementById('reviewModal').classList.remove('show'); }
    function setupRatingStars() { document.querySelectorAll('.rating-input i').forEach(star => { star.onclick = () => { const rating = parseInt(star.dataset.rating); currentRating = rating; document.getElementById('reviewRating').value = rating; document.querySelectorAll('.rating-input i').forEach((s, i) => { if (i < rating) { s.classList.add('active', 'fas'); s.classList.remove('far'); } else { s.classList.remove('active', 'fas'); s.classList.add('far'); } }); }; }); }
    function submitReview() { const name = document.getElementById('reviewerName').value.trim(); const rating = currentRating; const text = document.getElementById('reviewText').value.trim(); if (!name) { showToast('لطفاً نام خود را وارد کنید', 'error'); return; } if (rating === 0) { showToast('لطفاً امتیاز خود را انتخاب کنید', 'error'); return; } if (!text) { showToast('لطفاً نظر خود را بنویسید', 'error'); return; } const reviews = JSON.parse(localStorage.getItem(`product_reviews_${currentProduct.id}`)) || []; reviews.push({ id: Date.now(), name: name, rating: rating, text: text, date: new Date().toLocaleDateString('fa-IR') }); localStorage.setItem(`product_reviews_${currentProduct.id}`, JSON.stringify(reviews)); const newAvg = reviews.reduce((s, r) => s + r.rating, 0) / reviews.length; currentProduct.rating = parseFloat(newAvg.toFixed(1)); currentProduct.reviews = reviews.length; const index = products.findIndex(p => p.id === currentProduct.id); if (index !== -1) products[index] = currentProduct; localStorage.setItem(STORAGE_KEY, JSON.stringify(products)); closeReviewModal(); loadReviews(); displayProduct(); showToast('نظر شما با موفقیت ثبت شد'); }
    function loadSimilarProducts() { const similar = products.filter(p => p.category === currentProduct.category && p.id !== currentProduct.id).slice(0, 4); const section = document.getElementById('similarSection'); if (similar.length === 0) { section.style.display = 'none'; return; } section.style.display = 'block'; document.getElementById('similarProducts').innerHTML = similar.map(p => `<div class="similar-card" onclick="window.location.href='product.html?id=${p.id}'"><div class="similar-img">${p.emoji}</div><div class="similar-name">${p.name}</div><div class="similar-price">${p.price.toLocaleString()} تومان</div></div>`).join(''); }
    function updateCartCount() { const cart = JSON.parse(localStorage.getItem('barman_cart')) || []; const count = cart.reduce((s, i) => s + i.quantity, 0); const cartCountSpan = document.getElementById('cartCount'); if (cartCountSpan) cartCountSpan.innerText = count; }
    function showToast(msg, type = 'success') { const toast = document.getElementById('toast'); const toastMsg = document.getElementById('toastMsg'); toastMsg.innerText = msg; toast.classList.add('show'); if (type === 'error') toast.classList.add('error'); else toast.classList.remove('error'); setTimeout(() => toast.classList.remove('show'), 2000); }
    setupRatingStars(); loadProducts(); updateCartCount();
</script>
</body>
