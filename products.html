<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>محصولات | بارمان مرکب کویر</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #ef6b00;
            --primary-dark: #d35400;
            --primary-light: #f39c12;
            --success: #27ae60;
            --danger: #e74c3c;
            --warning: #f39c12;
            --dark: #2d3436;
            --gray: #7f8c8d;
            --gray-light: #ecf0f1;
            --light: #f8f9fa;
            --white: #ffffff;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.05);
            --shadow-md: 0 5px 20px rgba(0,0,0,0.08);
            --shadow-lg: 0 15px 35px rgba(0,0,0,0.12);
            --shadow-xl: 0 25px 50px rgba(0,0,0,0.2);
            --shadow-neon: 0 0 20px rgba(239,107,0,0.6);
            --shadow-neon-white: 0 0 20px rgba(255,255,255,0.5);
            --transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
            --transition-bounce: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            --radius: 12px;
            --radius-lg: 20px;
            --radius-xl: 28px;
        }

        body {
            font-family: 'Vazirmatn', 'Tahoma', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e8ecf1 100%);
            direction: rtl;
            color: var(--dark);
            scroll-behavior: smooth;
            overflow-x: hidden;
        }

        /* انیمیشن‌های پیشرفته */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-50px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInRight {
            from { opacity: 0; transform: translateX(50px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes fadeInLeft {
            from { opacity: 0; transform: translateX(-50px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }
        @keyframes rotateIn {
            from { opacity: 0; transform: rotate(-180deg) scale(0.5); }
            to { opacity: 1; transform: rotate(0) scale(1); }
        }
        @keyframes bounce {
            0%,100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); box-shadow: var(--shadow-neon); }
            100% { transform: scale(1); }
        }
        @keyframes pulseGlow {
            0% { box-shadow: 0 0 0 0 rgba(239,107,0,0.7); }
            70% { box-shadow: 0 0 0 15px rgba(239,107,0,0); }
            100% { box-shadow: 0 0 0 0 rgba(239,107,0,0); }
        }
        @keyframes shimmer {
            0% { background-position: -1000px 0; }
            100% { background-position: 1000px 0; }
        }
        @keyframes float {
            0%,100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(2deg); }
        }
        @keyframes floatSlow {
            0%,100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        @keyframes blink {
            0%,100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        @keyframes slideInLeft {
            from { transform: translateX(-100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes zoomIn {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        @keyframes wobble {
            0%,100% { transform: translateX(0); }
            15% { transform: translateX(-5px); }
            30% { transform: translateX(5px); }
            45% { transform: translateX(-3px); }
            60% { transform: translateX(3px); }
            75% { transform: translateX(-1px); }
        }
        @keyframes glowPulse {
            0% { text-shadow: 0 0 5px var(--primary); }
            50% { text-shadow: 0 0 20px var(--primary), 0 0 30px var(--primary); }
            100% { text-shadow: 0 0 5px var(--primary); }
        }

        /* کلاس‌های انیمیشن */
        .animate-fadeUp { animation: fadeInUp 0.6s ease forwards; }
        .animate-fadeDown { animation: fadeInDown 0.6s ease forwards; }
        .animate-fadeRight { animation: fadeInRight 0.6s ease forwards; }
        .animate-fadeLeft { animation: fadeInLeft 0.6s ease forwards; }
        .animate-scale { animation: scaleIn 0.5s ease forwards; }
        .animate-rotate { animation: rotateIn 0.6s ease forwards; }
        .animate-float { animation: float 3s ease infinite; }
        .animate-floatSlow { animation: floatSlow 4s ease infinite; }
        .animate-pulse { animation: pulse 2s ease infinite; }
        .animate-pulseGlow { animation: pulseGlow 2s ease infinite; }
        .animate-bounce { animation: bounce 2s ease infinite; }
        .animate-spin { animation: spin 0.5s linear infinite; }
        .animate-wobble:hover { animation: wobble 0.5s ease; }

        /* اسکرول بار جذاب */
        ::-webkit-scrollbar { width: 10px; height: 8px; }
        ::-webkit-scrollbar-track { background: linear-gradient(135deg, #f5f7fa, #e8ecf1); border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary-dark); transform: scale(1.1); }

        .top-bar {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: var(--gray-light);
            padding: 8px 40px;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            position: relative;
            overflow: hidden;
        }
        .top-bar::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            animation: shimmer 3s infinite;
        }
        .top-bar a { 
            color: var(--gray-light); 
            text-decoration: none; 
            margin-left: 20px; 
            transition: var(--transition);
            position: relative;
        }
        .top-bar a::after {
            content: '';
            position: absolute;
            bottom: -2px;
            right: 0;
            width: 0;
            height: 2px;
            background: var(--primary);
            transition: var(--transition);
        }
        .top-bar a:hover::after { width: 100%; }
        .top-bar a:hover { color: var(--primary); transform: translateX(-3px); }

        .main-header {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(15px);
            padding: 12px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 20px;
            box-shadow: var(--shadow-md);
            position: sticky;
            top: 0;
            z-index: 1000;
            transition: var(--transition);
        }
        .main-header:hover { box-shadow: var(--shadow-xl); }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: var(--transition-bounce);
        }
        .logo:hover { transform: scale(1.05) rotate(2deg); }
        .logo-icon {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
            box-shadow: var(--shadow-md);
            transition: var(--transition);
        }
        .logo:hover .logo-icon { transform: rotate(360deg) scale(1.1); animation: pulseGlow 0.5s ease; }
        .logo h1 {
            font-size: 22px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-weight: 800;
        }

        .back-btn {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 50px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            transition: var(--transition-bounce);
            position: relative;
            overflow: hidden;
        }
        .back-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s;
        }
        .back-btn:hover::before { left: 100%; }
        .back-btn:hover {
            transform: translateX(-8px);
            box-shadow: var(--shadow-neon);
            gap: 15px;
        }

        .products-main {
            margin: 30px 40px;
            animation: fadeInUp 0.8s ease;
        }

        .products-header {
            background: linear-gradient(135deg, white, var(--light));
            border-radius: var(--radius-xl);
            padding: 25px 30px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            box-shadow: var(--shadow-lg);
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }
        .products-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(239,107,0,0.05), transparent);
            animation: shimmer 4s infinite;
        }
        .products-header:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-xl);
        }
        .category-title-big {
            font-size: 28px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 15px;
            background: linear-gradient(135deg, var(--dark), var(--primary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .category-title-big i {
            font-size: 40px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: bounce 2s ease infinite;
        }
        .product-count {
            color: white;
            font-size: 14px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            padding: 8px 20px;
            border-radius: 50px;
            font-weight: 600;
            box-shadow: var(--shadow-md);
            transition: var(--transition);
        }
        .product-count:hover {
            transform: scale(1.05);
            box-shadow: var(--shadow-neon);
        }

        .sort-section {
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(10px);
            border-radius: var(--radius-xl);
            padding: 18px 25px;
            margin-bottom: 25px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            box-shadow: var(--shadow-md);
            transition: var(--transition);
        }
        .sort-section:hover {
            box-shadow: var(--shadow-lg);
            transform: translateY(-2px);
        }
        .sort-section label {
            font-weight: 600;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--dark);
        }
        .sort-section label i {
            color: var(--primary);
            font-size: 18px;
        }
        .sort-section select {
            padding: 10px 20px;
            border: 2px solid var(--gray-light);
            border-radius: 50px;
            font-family: inherit;
            background: white;
            cursor: pointer;
            transition: var(--transition);
            font-weight: 500;
        }
        .sort-section select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: var(--shadow-neon);
        }
        .sort-section select:hover {
            border-color: var(--primary);
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 28px;
            margin-bottom: 40px;
        }

        .product-card {
            background: white;
            border-radius: var(--radius-xl);
            overflow: hidden;
            transition: var(--transition-bounce);
            cursor: pointer;
            position: relative;
            box-shadow: var(--shadow-md);
            border: 1px solid rgba(239,107,0,0.1);
        }
        .product-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(239,107,0,0.08), transparent);
            transition: left 0.6s;
            z-index: 1;
        }
        .product-card:hover::before { left: 100%; }
        .product-card:hover {
            transform: translateY(-12px) scale(1.02);
            box-shadow: var(--shadow-xl);
            border-color: var(--primary);
        }
        .product-img {
            height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #fef5e7, #fff3e0);
            position: relative;
            overflow: hidden;
            transition: var(--transition);
        }
        .product-card:hover .product-img {
            background: linear-gradient(135deg, #fff0e0, #ffe4cc);
        }
        .product-img span {
            font-size: 75px;
            transition: var(--transition-bounce);
            filter: drop-shadow(2px 4px 8px rgba(0,0,0,0.1));
        }
        .product-card:hover .product-img span {
            transform: scale(1.15) rotate(8deg);
            filter: drop-shadow(4px 8px 15px rgba(239,107,0,0.3));
        }
        .discount-badge {
            position: absolute;
            top: 15px;
            left: 15px;
            background: linear-gradient(135deg, var(--danger), #c0392b);
            color: white;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: bold;
            animation: pulseGlow 2s infinite;
            z-index: 2;
            box-shadow: var(--shadow-sm);
        }
        .new-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background: linear-gradient(135deg, var(--success), #1e8449);
            color: white;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: bold;
            z-index: 2;
            box-shadow: var(--shadow-sm);
        }
        .wishlist-btn {
            position: absolute;
            bottom: 15px;
            right: 15px;
            background: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            color: #ccc;
            box-shadow: var(--shadow-md);
            z-index: 5;
            transition: var(--transition-bounce);
            font-size: 18px;
        }
        .wishlist-btn:hover {
            transform: scale(1.2);
            background: #fee;
            box-shadow: var(--shadow-lg);
        }
        .wishlist-btn.active {
            color: var(--danger);
            animation: pulse 0.5s ease;
        }
        .product-info {
            padding: 18px;
        }
        .product-title {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 10px;
            height: 46px;
            overflow: hidden;
            color: var(--dark);
            transition: var(--transition);
            line-height: 1.5;
        }
        .product-card:hover .product-title {
            color: var(--primary);
        }
        .price-row {
            display: flex;
            align-items: baseline;
            gap: 10px;
            margin: 10px 0;
            flex-wrap: wrap;
        }
        .current-price {
            color: var(--danger);
            font-size: 20px;
            font-weight: 800;
        }
        .old-price {
            color: var(--gray);
            font-size: 13px;
            text-decoration: line-through;
        }
        .rating {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--warning);
            margin-top: 8px;
        }
        .rating i {
            margin-left: 2px;
        }

        .no-products {
            text-align: center;
            padding: 100px 20px;
            background: white;
            border-radius: var(--radius-xl);
            color: var(--gray);
            grid-column: 1/-1;
            box-shadow: var(--shadow-md);
            animation: fadeInUp 0.5s ease;
        }
        .no-products i {
            font-size: 80px;
            margin-bottom: 20px;
            opacity: 0.5;
            animation: floatSlow 3s ease infinite;
        }
        .no-products h3 {
            font-size: 24px;
            margin-bottom: 12px;
            color: #333;
        }
        .no-products p {
            font-size: 14px;
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .page-btn {
            width: 45px;
            height: 45px;
            border: 2px solid var(--gray-light);
            background: white;
            border-radius: 50%;
            cursor: pointer;
            transition: var(--transition-bounce);
            font-weight: 600;
            font-size: 16px;
        }
        .page-btn:hover {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border-color: var(--primary);
            transform: scale(1.1);
            box-shadow: var(--shadow-neon);
        }
        .page-btn.active {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border-color: var(--primary);
            box-shadow: var(--shadow-md);
        }

        .footer {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: white;
            padding: 50px 40px 30px;
            margin-top: 50px;
            position: relative;
            overflow: hidden;
        }
        .footer::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
            animation: shimmer 5s infinite;
        }
        .footer-content {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 40px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .footer-col h4 {
            margin-bottom: 20px;
            font-size: 18px;
            position: relative;
            padding-bottom: 10px;
            display: inline-block;
        }
        .footer-col h4::after {
            content: '';
            position: absolute;
            bottom: 0;
            right: 0;
            width: 50px;
            height: 3px;
            background: var(--primary);
            border-radius: 3px;
            transition: var(--transition);
        }
        .footer-col:hover h4::after { width: 100%; }
        .footer-col a {
            display: block;
            color: #b2bec3;
            text-decoration: none;
            margin-bottom: 12px;
            font-size: 13px;
            transition: var(--transition);
        }
        .footer-col a:hover {
            color: var(--primary);
            padding-right: 8px;
            transform: translateX(-5px);
        }
        .footer-bottom {
            text-align: center;
            padding-top: 35px;
            margin-top: 35px;
            border-top: 1px solid rgba(255,255,255,0.1);
            font-size: 12px;
            color: #b2bec3;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 30px;
            background: linear-gradient(135deg, var(--success), #1e8449);
            color: white;
            padding: 14px 28px;
            border-radius: 60px;
            z-index: 2000;
            transform: translateX(-500px);
            transition: transform 0.3s ease;
            box-shadow: var(--shadow-xl);
            font-size: 14px;
            font-weight: 500;
        }
        .toast.show { transform: translateX(0); animation: wobble 0.5s ease; }
        .toast.error { background: linear-gradient(135deg, var(--danger), #c0392b); }

        .back-to-top {
            position: fixed;
            bottom: 80px;
            left: 25px;
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: none;
            z-index: 1000;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-lg);
            transition: var(--transition-bounce);
        }
        .back-to-top:hover {
            transform: scale(1.15);
            box-shadow: var(--shadow-neon);
        }
        .back-to-top.show { display: flex; animation: fadeInUp 0.3s ease; }

        @media (max-width: 992px) {
            .products-grid { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; }
        }
        @media (max-width: 768px) {
            .top-bar { display: none; }
            .main-header { padding: 12px 20px; }
            .back-btn span { display: none; }
            .products-main { margin: 15px; }
            .products-header { padding: 15px 20px; flex-direction: column; text-align: center; }
            .category-title-big { font-size: 22px; }
            .category-title-big i { font-size: 32px; }
            .sort-section { justify-content: center; padding: 15px 20px; }
            .products-grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; }
            .product-img { height: 170px; }
            .product-img span { font-size: 55px; }
            .product-title { font-size: 12px; height: 38px; }
            .current-price { font-size: 16px; }
            .page-btn { width: 38px; height: 38px; font-size: 14px; }
        }
        @media (max-width: 480px) {
            .products-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
            .product-img { height: 140px; }
            .product-img span { font-size: 45px; }
        }
    </style>
</head>

<div class="top-bar">
    <div>

        <a href="#">مجله ساختمان</a>
        <a href="contact.html">تماس با ما</a>
        <a href="faq.html">سوالات متداول</a>
    </div>
    <div><i class="fas fa-tag"></i> تخفیف ویژه مصالح تا ۳۰٪</div>
</div>

<div class="main-header">
    <div class="logo" onclick="window.location.href='shop.html'">

<div class="products-main">
    <div class="products-header animate-fadeUp">

            <i id="categoryIcon" class="animate-float">🧱</i>
            <span id="categoryName">سیمان</span>

            <i class="fas fa-box"></i> <span id="productCount">0</span> محصول

    </div>

    <div class="sort-section animate-fadeUp">
        <label><i class="fas fa-sort-amount-down"></i> مرتب‌سازی:</label>
        <select id="sortBy">
            <option value="default">پیش‌فرض</option>
            <option value="price_asc">ارزان‌ترین</option>
            <option value="price_desc">گران‌ترین</option>
            <option value="rating_desc">محبوب‌ترین</option>
            <option value="newest">جدیدترین</option>
        </select>
    </div>

    <div class="products-grid" id="productsGrid"></div>
    
    <div class="pagination" id="pagination"></div>
</div>

    </div>
    <div class="footer-bottom"><p>© ۱۴۰۳ بارمان مرکب کویر - تمامی حقوق محفوظ است</p></div>
</div>

<button class="back-to-top" id="backToTop" onclick="scrollToTop()"><i class="fas fa-arrow-up"></i></button>
<div class="toast" id="toast"><i class="fas fa-check-circle"></i> <span id="toastMsg"></span></div>

<script>
    const STORAGE_KEY = 'barman_products';
    let products = [];
    let wishlist = [];
    let currentCategory = '';
    let currentPage = 1;
    const itemsPerPage = 12;

    const categoryInfo = {
        cement: { name: 'سیمان', icon: '🧱' },
        block: { name: 'بلوک', icon: '🔲' },
        brick: { name: 'آجر', icon: '🧱' },
        steel: { name: 'تیرآهن و پروفیل', icon: '📐' },
        roof: { name: 'سقف', icon: '🏠' },
        tile: { name: 'کاشی و سرامیک', icon: '🔲' },
        wood: { name: 'چوب', icon: '🌲' },
        door: { name: 'درب و پنجره', icon: '🚪' },
        paint: { name: 'رنگ', icon: '🎨' },
        tools: { name: 'ابزارآلات', icon: '🔧' },
        gypsum: { name: 'گچ', icon: '⚪' },
        sand: { name: 'ماسه و شن', icon: '🏖️' },
        pumice: { name: 'پوکه', icon: '🪨' },
        lime: { name: 'آهک', icon: '🔥' },
        pipe: { name: 'لوله و اتصالات', icon: '📦' },
        insulation: { name: 'عایق و ایزوگام', icon: '🛢️' },
        additive: { name: 'مواد افزودنی و چسب', icon: '🧪' }
    };

    function loadProducts() {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved && JSON.parse(saved).length > 0) {
            products = JSON.parse(saved);
        } else {
            products = getDefaultProducts();
            localStorage.setItem(STORAGE_KEY, JSON.stringify(products));
        }
        
        const urlParams = new URLSearchParams(window.location.search);
        currentCategory = urlParams.get('cat') || 'cement';
        
        const info = categoryInfo[currentCategory] || { name: 'محصولات', icon: '📦' };
        document.getElementById('categoryName').innerText = info.name;
        document.getElementById('categoryIcon').innerHTML = info.icon;
        
        loadWishlist();
        applyFiltersAndRender();
    }

    function getDefaultProducts() {
        return [
            { id: 1, name: "پودر سنگ زنبق 25 کیلوگرمی", price: 45000, oldPrice: null, category: "additive", rating: 4.5, reviews: 12, emoji: "🧪", isNew: false, isAmazing: false },
            { id: 2, name: "پودر سنگ نگین 25 کیلوگرمی", price: 46000, oldPrice: null, category: "additive", rating: 4.5, reviews: 8, emoji: "🧪", isNew: false, isAmazing: false },
            { id: 3, name: "پوکه لیکا دانه ای", price: 35000, oldPrice: null, category: "pumice", rating: 4.5, reviews: 15, emoji: "🪨", isNew: false, isAmazing: true },
            { id: 4, name: "ماسه شسته شده مهریز بتنی", price: 28000, oldPrice: null, category: "sand", rating: 4.5, reviews: 22, emoji: "🏖️", isNew: false, isAmazing: false },
            { id: 5, name: "سیمان مهریز 50 کیلویی", price: 85000, oldPrice: 95000, category: "cement", rating: 4.9, reviews: 45, emoji: "🧱", isNew: true, isAmazing: true },
            { id: 6, name: "گچ سفید کاری سمنان", price: 28000, oldPrice: null, category: "gypsum", rating: 4.5, reviews: 18, emoji: "⚪", isNew: false, isAmazing: false },
            { id: 7, name: "آجر روکار 5 سانت درجه یک", price: 4500, oldPrice: 5500, category: "brick", rating: 4.8, reviews: 32, emoji: "🧱", isNew: false, isAmazing: true },
            { id: 8, name: "بلوک تیغه 10 سانتی", price: 15000, oldPrice: null, category: "block", rating: 4.5, reviews: 14, emoji: "🔲", isNew: false, isAmazing: false },
            { id: 9, name: "میلگرد سایز 14", price: 45000, oldPrice: 52000, category: "steel", rating: 4.8, reviews: 28, emoji: "📐", isNew: false, isAmazing: true },
            { id: 10, name: "چسب کاشی غفاری", price: 25000, oldPrice: null, category: "additive", rating: 4.6, reviews: 19, emoji: "🧪", isNew: false, isAmazing: false }
        ];
    }

    function loadWishlist() {
        const saved = localStorage.getItem('barman_wishlist');
        if (saved) wishlist = JSON.parse(saved);
        else wishlist = [];
    }

    function saveWishlist() {
        localStorage.setItem('barman_wishlist', JSON.stringify(wishlist));
    }

    function toggleWishlist(productId) {
        if (wishlist.includes(productId)) {
            wishlist = wishlist.filter(id => id !== productId);
            showToast('از علاقه‌مندی‌ها حذف شد');
        } else {
            wishlist.push(productId);
            showToast('به علاقه‌مندی‌ها اضافه شد ❤️');
        }
        saveWishlist();
        applyFiltersAndRender();
    }

    function getFilteredProducts() {
        let filtered = products.filter(p => p.category === currentCategory);
        
        const sortBy = document.getElementById('sortBy').value;
        if (sortBy === 'price_asc') {
            filtered.sort((a, b) => a.price - b.price);
        } else if (sortBy === 'price_desc') {
            filtered.sort((a, b) => b.price - a.price);
        } else if (sortBy === 'rating_desc') {
            filtered.sort((a, b) => b.rating - a.rating);
        } else if (sortBy === 'newest') {
            filtered.sort((a, b) => (b.isNew === a.isNew) ? 0 : b.isNew ? 1 : -1);
        }
        
        return filtered;
    }

    function applyFiltersAndRender() {
        const filtered = getFilteredProducts();
        document.getElementById('productCount').innerText = filtered.length;
        
        const totalPages = Math.ceil(filtered.length / itemsPerPage);
        if (currentPage > totalPages && totalPages > 0) currentPage = totalPages;
        if (currentPage < 1) currentPage = 1;
        
        const start = (currentPage - 1) * itemsPerPage;
        const paginated = filtered.slice(start, start + itemsPerPage);
        
        renderProducts(paginated);
        renderPagination(totalPages);
    }

    function formatPrice(p) {
        return p.toLocaleString();
    }

    function renderProducts(productsToShow) {
        const grid = document.getElementById('productsGrid');
        
        if (!productsToShow || productsToShow.length === 0) {
            grid.innerHTML = `
                <div class="no-products">
                    <i class="fas fa-box-open"></i>
                    <h3>✨ محصولی یافت نشد ✨</h3>
                    <p>محصول جدید به زودی به این دسته اضافه خواهد شد</p>
                </div>
            `;
            return;
        }
        
        grid.innerHTML = productsToShow.map((p, index) => `
            <div class="product-card" style="animation: fadeInUp 0.5s ease ${index * 0.05}s forwards; opacity: 0;" onclick="goToProduct(${p.id})">
                ${p.oldPrice ? `<div class="discount-badge">🔥 ${Math.round((1 - p.price/p.oldPrice)*100)}%</div>` : ''}
                ${p.isNew ? `<div class="new-badge">🆕 جدید</div>` : ''}
                <button class="wishlist-btn ${wishlist.includes(p.id) ? 'active' : ''}" onclick="event.stopPropagation(); toggleWishlist(${p.id})">
                    <i class="${wishlist.includes(p.id) ? 'fas' : 'far'} fa-heart"></i>
                </button>
                <div class="product-img">
                    <span class="animate-floatSlow">${p.emoji || '📦'}</span>
                </div>
                <div class="product-info">
                    <div class="product-title">${p.name}</div>
                    <div class="price-row">
                        <span class="current-price">${formatPrice(p.price)} تومان</span>
                        ${p.oldPrice ? `<span class="old-price">${formatPrice(p.oldPrice)} تومان</span>` : ''}
                    </div>
                    <div class="rating">
                        ${'<i class="fas fa-star"></i>'.repeat(Math.floor(p.rating))}
                        ${p.rating % 1 >= 0.5 ? '<i class="fas fa-star-half-alt"></i>' : ''}
                        <span style="color:#999; margin-right:5px;">(${p.reviews})</span>
                    </div>
                </div>
            </div>
        `).join('');
    }

    function renderPagination(totalPages) {
        const container = document.getElementById('pagination');
        if (totalPages <= 1) {
            container.innerHTML = '';
            return;
        }
        
        let html = '';
        for (let i = 1; i <= totalPages; i++) {
            html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
        }
        container.innerHTML = html;
    }

    function goToPage(page) {
        currentPage = page;
        applyFiltersAndRender();
        window.scrollTo({ top: 400, behavior: 'smooth' });
    }

    function goToProduct(id) {
        window.location.href = `product.html?id=${id}`;
    }

    function showToast(msg, type = 'success') {
        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toastMsg');
        toastMsg.innerText = msg;
        toast.classList.add('show');
        if (type === 'error') toast.classList.add('error');
        else toast.classList.remove('error');
        setTimeout(() => toast.classList.remove('show'), 2000);
    }

    function scrollToTop() {
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    document.getElementById('sortBy').addEventListener('change', () => { 
        currentPage = 1; 
        applyFiltersAndRender(); 
    });

    window.addEventListener('scroll', function() {
        const btn = document.getElementById('backToTop');
        if (btn) {
            if (window.scrollY > 300) btn.classList.add('show');
            else btn.classList.remove('show');
        }
    });

    loadProducts();
</script>
</body>
</html>
