<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>نتایج جستجو | بارمان مرکب کویر</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #e67e22;
            --primary-dark: #d35400;
            --success: #27ae60;
            --danger: #e74c3c;
            --dark: #2d3436;
            --gray: #7f8c8d;
            --light: #f8f9fa;
            --white: #ffffff;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.05);
            --shadow-md: 0 5px 20px rgba(0,0,0,0.08);
            --shadow-lg: 0 15px 35px rgba(0,0,0,0.12);
            --transition: all 0.3s ease;
            --radius: 12px;
            --radius-lg: 20px;
        }
        body {
            font-family: 'Tahoma', 'Segoe UI', sans-serif;
            background: var(--light);
            direction: rtl;
            color: var(--dark);
        }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        .container { max-width: 1300px; margin: 0 auto; padding: 20px; }

        /* هدر */
        .header {
            background: white;
            border-radius: 20px;
            padding: 15px 25px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            box-shadow: var(--shadow-md);
        }
        .logo { display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .logo-icon {
            width: 45px; height: 45px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
        }
        .logo h1 { font-size: 22px; color: #333; }
        .search-box {
            flex: 1;
            max-width: 500px;
            display: flex;
            background: var(--light);
            border-radius: 50px;
            overflow: hidden;
            border: 2px solid #e0e0e0;
        }
        .search-box input { flex: 1; padding: 12px 20px; border: none; background: none; outline: none; font-size: 14px; }
        .search-box button { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white; border: none; padding: 0 22px; cursor: pointer; }
        .back-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 30px;
            cursor: pointer;
        }

        /* بخش نتایج */
        .search-header {
            background: white;
            border-radius: 20px;
            padding: 20px 25px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            box-shadow: var(--shadow-sm);
        }
        .search-term {
            font-size: 18px;
            font-weight: bold;
            color: var(--primary);
        }
        .result-count {
            color: var(--gray);
            font-size: 14px;
        }
        .filter-bar {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .filter-chip {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 30px;
            padding: 8px 18px;
            font-size: 13px;
            cursor: pointer;
            transition: var(--transition);
        }
        .filter-chip:hover, .filter-chip.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .product-card {
            background: white;
            border-radius: var(--radius-lg);
            overflow: hidden;
            transition: var(--transition);
            cursor: pointer;
            box-shadow: var(--shadow-sm);
            position: relative;
        }
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-lg);
        }
        .product-img {
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--light);
            position: relative;
        }
        .product-img img { max-width: 85%; max-height: 85%; object-fit: contain; }
        .product-img span { font-size: 55px; }
        .discount-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: var(--danger);
            color: white;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 11px;
        }
        .new-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: var(--success);
            color: white;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 11px;
        }
        .wishlist-btn {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: white;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            color: #ccc;
            box-shadow: var(--shadow-sm);
            z-index: 5;
        }
        .wishlist-btn.active { color: var(--danger); }
        .product-info { padding: 15px; }
        .product-title { font-size: 14px; font-weight: 600; margin-bottom: 5px; height: 40px; overflow: hidden; }
        .price-row { display: flex; align-items: baseline; gap: 8px; margin: 8px 0; flex-wrap: wrap; }
        .current-price { color: var(--danger); font-size: 16px; font-weight: bold; }
        .old-price { color: var(--gray); font-size: 12px; text-decoration: line-through; }
        .rating { display: flex; align-items: center; gap: 5px; font-size: 11px; color: #f39c12; margin-top: 5px; }
        .add-to-cart {
            width: 100%;
            background: var(--light);
            border: none;
            padding: 10px;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 12px;
            transition: var(--transition);
            font-weight: 500;
        }
        .add-to-cart:hover { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white; }

        .empty-result {
            text-align: center;
            padding: 80px 20px;
            background: white;
            border-radius: 20px;
            color: var(--gray);
        }
        .empty-result i { font-size: 80px; margin-bottom: 20px; opacity: 0.5; }
        .empty-result h3 { font-size: 22px; margin-bottom: 10px; color: #333; }

        .footer {
            background: var(--dark);
            color: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            margin-top: 40px;
        }
        .footer a { color: #b2bec3; text-decoration: none; margin: 0 10px; }
        .footer a:hover { color: var(--primary); }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 30px;
            background: var(--success);
            color: white;
            padding: 10px 20px;
            border-radius: 50px;
            z-index: 2000;
            transform: translateX(-400px);
            transition: transform 0.3s;
        }
        .toast.show { transform: translateX(0); }
        .toast.error { background: var(--danger); }

        @media (max-width: 768px) {
            .container { padding: 15px; }
            .products-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
            .header { flex-direction: column; }
            .search-box { width: 100%; max-width: none; }
            .search-header { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="logo" onclick="window.location.href='shop.html'">
            <div class="logo-icon"><i class="fas fa-hard-hat"></i></div>
            <h1>بارمان مرکب کویر</h1>
        </div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="جستجوی مصالح..." value="">
            <button onclick="searchAgain()"><i class="fas fa-search"></i></button>
        </div>
        <button class="back-btn" onclick="window.location.href='shop.html'">
            <i class="fas fa-arrow-right"></i> بازگشت
        </button>
    </div>

    <div class="search-header">
        <div>
            <span class="search-term" id="searchTerm"></span>
            <span class="result-count" id="resultCount"></span>
        </div>
        <div class="filter-bar">
            <div class="filter-chip active" data-filter="all" onclick="filterResults('all')">همه</div>
            <div class="filter-chip" data-filter="amazing" onclick="filterResults('amazing')">🔥 شگفت‌انگیز</div>
            <div class="filter-chip" data-filter="new" onclick="filterResults('new')">🆕 جدیدترین</div>
            <div class="filter-chip" data-filter="cheap" onclick="filterResults('cheap')">💰 ارزان‌ترین</div>
            <div class="filter-chip" data-filter="expensive" onclick="filterResults('expensive')">💎 گران‌ترین</div>
        </div>
    </div>

    <div class="products-grid" id="productsGrid"></div>

    <div class="footer">
        <p>© ۱۴۰۳ بارمان مرکب کویر - تمامی حقوق محفوظ است</p>
        <p style="margin-top: 10px;">
            <a href="about.html">درباره ما</a>
            <a href="contact.html">تماس با ما</a>
            <a href="faq.html">سوالات متداول</a>
            <a href="terms.html">قوانین</a>
        </p>
    </div>
</div>

<div class="toast" id="toast"><span id="toastMsg"></span></div>

<script>
    const STORAGE_KEY = 'barman_products';
    let products = [];
    let currentSearchTerm = '';
    let currentFilter = 'all';
    let wishlist = [];

    function getSearchTermFromUrl() {
        const params = new URLSearchParams(window.location.search);
        return params.get('q') || '';
    }

    function loadProducts() {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved && JSON.parse(saved).length > 0) {
            products = JSON.parse(saved);
        } else {
            products = [];
        }
        
        currentSearchTerm = getSearchTermFromUrl();
        document.getElementById('searchInput').value = currentSearchTerm;
        document.getElementById('searchTerm').innerHTML = `نتایج جستجو برای "${currentSearchTerm}"`;
        
        if (currentSearchTerm === '') {
            document.getElementById('searchTerm').innerHTML = 'همه محصولات';
        }
        
        performSearch();
    }

    function performSearch() {
        let results = [...products];
        
        if (currentSearchTerm !== '') {
            results = results.filter(p => p.name.toLowerCase().includes(currentSearchTerm.toLowerCase()));
        }
        
        // اعمال فیلتر
        if (currentFilter === 'amazing') {
            results = results.filter(p => p.isAmazing === true);
        } else if (currentFilter === 'new') {
            results = results.filter(p => p.isNew === true);
        } else if (currentFilter === 'cheap') {
            results.sort((a, b) => a.price - b.price);
        } else if (currentFilter === 'expensive') {
            results.sort((a, b) => b.price - a.price);
        }
        
        document.getElementById('resultCount').innerHTML = `${results.length} محصول`;
        
        const grid = document.getElementById('productsGrid');
        
        if (results.length === 0) {
            grid.innerHTML = `
                <div class="empty-result" style="grid-column: 1/-1;">
                    <i class="fas fa-search"></i>
                    <h3>نتیجه‌ای یافت نشد!</h3>
                    <p>عبارت دیگری را جستجو کنید یا از دسته‌بندی‌ها استفاده نمایید</p>
                    <button onclick="window.location.href='shop.html'" style="background: var(--primary); color: white; border: none; padding: 10px 25px; border-radius: 30px; margin-top: 20px; cursor: pointer;">بازگشت به فروشگاه</button>
                </div>
            `;
            return;
        }
        
        grid.innerHTML = results.map(p => `
            <div class="product-card" onclick="goToProduct(${p.id})">
                ${p.oldPrice ? `<div class="discount-badge">تخفیف</div>` : ''}
                ${p.isNew ? `<div class="new-badge">جدید</div>` : ''}
                <button class="wishlist-btn ${wishlist.includes(p.id) ? 'active' : ''}" onclick="event.stopPropagation(); toggleWishlist(${p.id})">
                    <i class="${wishlist.includes(p.id) ? 'fas' : 'far'} fa-heart"></i>
                </button>
                <div class="product-img">
                    ${p.imageData ? `<img src="${p.imageData}" alt="${p.name}">` : `<span>${p.emoji}</span>`}
                </div>
                <div class="product-info">
                    <div class="product-title">${highlightText(p.name, currentSearchTerm)}</div>
                    <div class="price-row">
                        <span class="current-price">${p.price.toLocaleString()} تومان</span>
                        ${p.oldPrice ? `<span class="old-price">${p.oldPrice.toLocaleString()} تومان</span>` : ''}
                    </div>
                    <div class="rating"><i class="fas fa-star"></i> ${p.rating} (${p.reviews || 0})</div>
                    <button class="add-to-cart" onclick="event.stopPropagation(); addToCart(${p.id})">➕ افزودن به سبد</button>
                </div>
            </div>
        `).join('');
    }

    function highlightText(text, search) {
        if (!search) return text;
        const regex = new RegExp(`(${search})`, 'gi');
        return text.replace(regex, '<mark style="background: #fef5e7; color: #e67e22; padding: 0;">$1</mark>');
    }

    function filterResults(filter) {
        currentFilter = filter;
        document.querySelectorAll('.filter-chip').forEach(chip => {
            chip.classList.remove('active');
        });
        document.querySelector(`.filter-chip[data-filter="${filter}"]`).classList.add('active');
        performSearch();
    }

    function searchAgain() {
        const newTerm = document.getElementById('searchInput').value.trim();
        window.location.href = `search.html?q=${encodeURIComponent(newTerm)}`;
    }

    function goToProduct(id) {
        window.location.href = `product.html?id=${id}`;
    }

    function addToCart(pid) {
        let p = products.find(p => p.id === pid);
        if (!p) return;
        let cart = JSON.parse(localStorage.getItem('barman_cart')) || [];
        let exist = cart.find(i => i.id === pid);
        if (exist) { exist.quantity++; showToast(p.name + ' +1'); }
        else { cart.push({ ...p, quantity: 1 }); showToast(p.name + ' به سبد اضافه شد'); }
        localStorage.setItem('barman_cart', JSON.stringify(cart));
        updateCartCount();
    }

    function loadWishlist() { 
        const s = localStorage.getItem('barman_wishlist'); 
        if (s) wishlist = JSON.parse(s); 
    }
    
    function saveWishlist() { 
        localStorage.setItem('barman_wishlist', JSON.stringify(wishlist)); 
        performSearch();
    }
    
    function toggleWishlist(pid) {
        if (wishlist.includes(pid)) { 
            wishlist = wishlist.filter(id => id !== pid); 
            showToast('از علاقه‌مندی‌ها حذف شد'); 
        } else { 
            wishlist.push(pid); 
            showToast('به علاقه‌مندی‌ها اضافه شد'); 
        }
        saveWishlist();
    }

    function updateCartCount() {
        const cart = JSON.parse(localStorage.getItem('barman_cart')) || [];
        const count = cart.reduce((s, i) => s + i.quantity, 0);
        const cartCountSpan = document.getElementById('cartCount');
        if (cartCountSpan) cartCountSpan.innerText = count;
    }

    function showToast(msg, type = 'success') {
        let toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toastMsg');
        if (toast && toastMsg) {
            toastMsg.innerText = msg;
            toast.classList.add('show');
            if (type === 'error') toast.classList.add('error');
            else toast.classList.remove('error');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }
    }

    document.getElementById('searchInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') searchAgain();
    });

    loadProducts();
    loadWishlist();
</script>
</body>
</html>
